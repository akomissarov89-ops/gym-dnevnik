<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;background:#0a0a0a;color:#e5e5e5;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0;display:flex;flex-direction:column}
.header{padding:16px 16px 8px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.header h1{font-size:22px;font-weight:700}
.header .subtitle{font-size:13px;color:#888;margin-top:2px}
.header-buttons{display:flex;gap:8px;flex-shrink:0}
.btn{padding:8px 14px;border-radius:10px;border:none;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
.btn-outline{background:transparent;border:1px solid #333;color:#e5e5e5}
.btn-outline:active{background:#222}
.btn-green{background:#b8e986;color:#0a0a0a}
.btn-green:active{background:#a0d470}
.calendar-bar{display:flex;align-items:center;gap:12px;padding:12px 16px}
.calendar-bar .nav-btn{width:40px;height:40px;border-radius:50%;background:#1a1a1a;border:none;color:#e5e5e5;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.calendar-bar .nav-btn:active{background:#333}
.calendar-bar .date-display{flex:1;text-align:center}
.calendar-bar .date-display .date{font-size:20px;font-weight:600}
.calendar-bar .date-display .weekday{font-size:13px;color:#888;margin-top:2px}
.day-tabs{display:flex;gap:8px;padding:0 16px 12px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.day-tabs::-webkit-scrollbar{display:none}
.day-tab{padding:8px 14px;border-radius:20px;background:#1a1a1a;border:none;color:#888;font-size:13px;font-weight:500;white-space:nowrap;cursor:pointer;transition:all .15s}
.day-tab.active{background:#e5e5e5;color:#0a0a0a}
.day-tab .day-name{color:#b8e986;font-weight:600}
.day-tab.active .day-name{color:#0a0a0a}
.workout-area{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 100px}
.exercise-card{background:#141414;border-radius:16px;margin-bottom:12px;overflow:hidden}
.exercise-header{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222}
.exercise-header h3{font-size:16px;font-weight:600}
.exercise-header .meta{font-size:12px;color:#888}
.exercise-prev{padding:8px 16px 10px;font-size:12px;color:#888;border-bottom:1px solid #1a1a1a;background:#0f0f0f}
.exercise-prev b{color:#b8e986;font-weight:600}
.exercise-note{padding:6px 16px 8px;font-size:12px;color:#666;font-style:italic}
.sets-header{display:grid;grid-template-columns:40px 1fr 80px 80px;padding:8px 16px;font-size:11px;color:#666;text-transform:uppercase;letter-spacing:.5px}
.sets-header>:nth-child(3),.sets-header>:nth-child(4){text-align:center}
.set-row{display:grid;grid-template-columns:40px 1fr 80px 80px;padding:10px 16px;align-items:center;border-top:1px solid #1a1a1a}
.set-num{font-size:14px;color:#666;font-weight:500}
.set-plan{font-size:13px;line-height:1.4}
.set-plan .plan-prev{color:#666;font-size:11px;margin-top:1px}
.set-plan .plan-type{color:#666;font-size:12px}
.set-input{display:flex;flex-direction:column;align-items:center;gap:2px}
.set-input label{font-size:9px;color:#666;text-transform:uppercase}
.set-input input{width:64px;height:32px;background:#1a1a1a;border:1px solid #333;border-radius:8px;color:#e5e5e5;text-align:center;font-size:14px;font-weight:600;outline:none}
.set-input input:focus{border-color:#b8e986}
.set-input input::placeholder{color:#444}
.copy-plan-btn{display:block;width:100%;padding:12px;background:transparent;border:none;color:#b8e986;font-size:14px;font-weight:600;text-align:right;cursor:pointer;border-top:1px solid #222}
.copy-plan-btn.clearing{color:#e57373}
.copy-plan-btn:active{background:#1a1a1a}
.bottom-bar{position:fixed;bottom:0;left:0;right:0;background:#0a0a0a;border-top:1px solid #222;padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px}
.bottom-bar .btn{flex:1;padding:14px;font-size:14px}
.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;z-index:1000;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
input[type=file]{display:none}
</style>

    <button class="btn btn-outline" onclick="document.getElementById('fileInput').click()">Загрузить Excel</button>
    <button class="btn btn-green" onclick="exportExcel()">Скачать Excel</button>
  </div>
</div>
<input type="file" id="fileInput" accept=".xlsx,.xls" onchange="importExcel(event)">

<div class="calendar-bar">
  <button class="nav-btn" onclick="navigateDay(-1)">‹</button>
  <div class="date-display">
    <div class="date" id="currentDate">—</div>
    <div class="weekday" id="currentWeekday">—</div>
  </div>
  <button class="nav-btn" onclick="navigateDay(1)">›</button>
</div>

<div class="day-tabs" id="dayTabs"></div>

<div class="workout-area" id="workoutArea"></div>

<div class="bottom-bar">
  <button class="btn btn-outline" id="planToggleBtn" onclick="toggleDayPlan()">⚡ Вес как в плане</button>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>

  ['Общая вода тела, л','60.7','61.6','+0.9','','Часть набора — вода, особенно если принимаешь креатин'],
  ['Базовый обмен, ккал','2158','2184','+26','','Расчётный показатель прибора'],
  ['Рекомендуемый приём, ккал','3168','3212','+44','','Прибор считает по обмену; совпадает с оценкой поддержания'],
  ['Индекс талия-бёдра','0.91','0.93','+0.02','','Выше 0,90 — граница нормы; вырос'],
  ['Висцеральный жир, уровень','7','7','0','','Без изменений, в норме'],
  ['Жир туловища, кг','8.4','9.3','+0.9','+0.08','Почти 70% набора жира пришлось на туловище'],
  ['Тощая масса туловища, кг','36.8','37.4','+0.6','',''],
  ['Тощая масса, ноги (сумма), кг','24.73','24.68','-0.05','','Не выросла, хотя руки и туловище растут; точность сегментов невысокая'],
  ['Тощая масса, руки (сумма), кг','10.29','10.49','+0.20','','']
];

const WEEKDAYS = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
const TRAINING_DOW = [1,3,5]; // Пн, Ср, Пт
const DOW_TO_DAY = {1:1, 3:2, 5:3};

let state = {
  currentDate: new Date(),
  currentDay: null,
  planDate: '2026-11-20',
  history: {},
  plan: JSON.parse(JSON.stringify(EXERCISES))
};

function init() {
  loadState();
  applySeedHistory();
  findCurrentDay();
  render();
}
function loadState() {
  try {
    const saved = localStorage.getItem('gymState2');
    if (saved) {
      const parsed = JSON.parse(saved);
      state = { ...state, ...parsed };
      if (state.currentDate) state.currentDate = new Date(state.currentDate);
      if (!state.plan || !state.plan[1]) state.plan = JSON.parse(JSON.stringify(EXERCISES));
    }
  } catch(e) {}
}
function saveState() { try { localStorage.setItem('gymState2', JSON.stringify(state)); } catch(e) {} }

function applySeedHistory() {
  Object.keys(SEED_HISTORY).forEach(dateKey => {
    const seed = SEED_HISTORY[dateKey];
    if (!state.history[dateKey]) state.history[dateKey] = { day: seed.day, exercises: {} };
    seed.ex.forEach((setsArr, exIdx) => {
      const exKey = `${seed.day}_${exIdx}`;
      if (!state.history[dateKey].exercises[exKey]) state.history[dateKey].exercises[exKey] = {};
      setsArr.forEach((wr, setIdx) => {
        const setKey = `${exIdx}_${setIdx}`;
        const existing = state.history[dateKey].exercises[exKey][setKey];
        if (!existing || (existing.w === '' && existing.r === '')) {
          state.history[dateKey].exercises[exKey][setKey] = { w: wr[0], r: wr[1] };
        }
      });
    });
  });
  saveState();
}

function formatDate(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function formatDateDisplay(d){return `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.${d.getFullYear()}`;}
function formatDateShort(d){return `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}`;}

// Умный календарь: ищет ближайший тренировочный день в нужном направлении
function findCurrentDay() {
  const d = new Date(state.currentDate);
  const dow = d.getDay();
  if (DOW_TO_DAY[dow]) { state.currentDay = DOW_TO_DAY[dow]; return; }
  // Нетренировочный день → прыгаем на ближайший вперёд
  const next = {0:1, 2:1, 4:1, 6:2}; // сколько дней вперёд до следующего тренировочного
  d.setDate(d.getDate() + next[dow]);
  state.currentDate = d;
  state.currentDay = DOW_TO_DAY[d.getDay()];
}

function navigateDay(dir) {
  // Ищем ближайший тренировочный день в направлении dir
  const d = new Date(state.currentDate);
  let attempts = 0;
  while (attempts < 14) {
    d.setDate(d.getDate() + dir);
    if (TRAINING_DOW.includes(d.getDay())) break;
    attempts++;
  }
  state.currentDate = d;
  state.currentDay = DOW_TO_DAY[d.getDay()];
  render();
}

function selectDay(n) { state.currentDay = n; render(); }

function expectedPlan(set){
  return {
    w: set.planW === 'свой вес' ? '' : set.planW,
    r: typeof set.planR === 'number' ? set.planR : parseInt(String(set.planR).split('–')[0])
  };
}
function isExercisePlanFilled(dayNum, exIdx){
  const ex = state.plan[dayNum][exIdx];
  const dateKey = formatDate(state.currentDate);
  const rec = state.history[dateKey];
  const exKey = `${dayNum}_${exIdx}`;
  if (!rec || !rec.exercises || !rec.exercises[exKey]) return false;
  return ex.sets.every((set, setIdx) => {
    const saved = rec.exercises[exKey][`${exIdx}_${setIdx}`];
    if (!saved) return false;
    const exp = expectedPlan(set);
    const wOk = exp.w === '' ? (saved.w === '' || saved.w == null) : (parseFloat(saved.w) === exp.w);
    const rOk = parseInt(saved.r) === exp.r;
    return wOk && rOk;
  });
}
function isDayPlanFilled(dayNum){ return state.plan[dayNum].every((_, i) => isExercisePlanFilled(dayNum, i)); }
function fillExercisePlan(dateKey, dayNum, exIdx){
  const ex = state.plan[dayNum][exIdx];
  if (!state.history[dateKey]) state.history[dateKey] = { day: dayNum, exercises: {} };
  const exKey = `${dayNum}_${exIdx}`;
  if (!state.history[dateKey].exercises[exKey]) state.history[dateKey].exercises[exKey] = {};
  ex.sets.forEach((set, setIdx) => {
    const exp = expectedPlan(set);
    state.history[dateKey].exercises[exKey][`${exIdx}_${setIdx}`] = { w: exp.w, r: exp.r };
  });
}
function clearExercisePlan(dateKey, dayNum, exIdx){
  const ex = state.plan[dayNum][exIdx];
  if (!state.history[dateKey] || !state.history[dateKey].exercises) return;
  const exKey = `${dayNum}_${exIdx}`;
  if (!state.history[dateKey].exercises[exKey]) return;
  ex.sets.forEach((_, setIdx) => { state.history[dateKey].exercises[exKey][`${exIdx}_${setIdx}`] = { w: '', r: '' }; });
}
function toggleExercisePlan(dayNum, exIdx){
  const dateKey = formatDate(state.currentDate);
  if (isExercisePlanFilled(dayNum, exIdx)) { clearExercisePlan(dateKey, dayNum, exIdx); showToast('План убран'); }
  else { fillExercisePlan(dateKey, dayNum, exIdx); showToast('Веса из плана заполнены'); }
  saveState(); render();
}
function toggleDayPlan(){
  const dateKey = formatDate(state.currentDate);
  if (isDayPlanFilled(state.currentDay)) {
    state.plan[state.currentDay].forEach((_, i) => clearExercisePlan(dateKey, state.currentDay, i));
    showToast('План убран со всей тренировки');
  } else {
    state.plan[state.currentDay].forEach((_, i) => fillExercisePlan(dateKey, state.currentDay, i));
    showToast('Все веса из плана заполнены');
  }
  saveState(); render();
}

function render(){renderHeader();renderCalendar();renderDayTabs();renderWorkout();saveState();}
function renderHeader(){
  const d=new Date(state.planDate);
  const filled=!!state.history[formatDate(state.currentDate)];
  document.getElementById('planLabel').textContent=`План от ${formatDateShort(d)} · Excel ${filled?'заполнен':'не открыт'}`;
  const btn=document.getElementById('planToggleBtn');
  btn.textContent = isDayPlanFilled(state.currentDay) ? '✕ Убрать план' : '⚡ Вес как в плане';
  btn.style.color = isDayPlanFilled(state.currentDay) ? '#e57373' : '#e5e5e5';
}
function renderCalendar(){
  const d=state.currentDate;
  document.getElementById('currentDate').textContent=formatDateDisplay(d);
  document.getElementById('currentWeekday').textContent=WEEKDAYS[d.getDay()];
}
function renderDayTabs(){
  const lastDates={};
  Object.keys(state.history).sort().reverse().forEach(ds=>{const day=state.history[ds].day;if(!lastDates[day])lastDates[day]=ds;});
  document.getElementById('dayTabs').innerHTML=[1,2,3].map(n=>{
    const lbl=lastDates[n]?` посл. ${formatDateShort(new Date(lastDates[n]))}`:'';
    return `<button class="day-tab ${n===state.currentDay?'active':''}" onclick="selectDay(${n})">День ${n} · <span class="day-name">${DAY_NAMES[n]}</span>${lbl}</button>`;
  }).join('');
}

// Сводка предыдущей тренировки этого дня по упражнению
function prevWorkoutSummary(dayNum, exIdx, currentDate) {
  const prevDate = findPreviousWorkoutDate(dayNum, currentDate);
  if (!prevDate) return null;
  const ex = state.plan[dayNum][exIdx];
  const working = ex.sets.filter(s => s.type === 'рабочий').map((set, setIdx) => {
    const s = state.history[prevDate]?.exercises?.[`${dayNum}_${exIdx}`]?.[`${exIdx}_${setIdx}`];
    return s ? `${s.w}×${s.r}` : '—';
  });
  return { date: prevDate, text: working.join(', ') };
}

function renderWorkout(){
  const exercises=state.plan[state.currentDay];
  const dateKey=formatDate(state.currentDate);
  const saved=state.history[dateKey];
  let html=`<div style="padding:12px 0 8px;font-size:14px;color:#888">
    <b style="color:#e5e5e5">${formatDateShort(state.currentDate)} · День ${state.currentDay} · ${DAY_NAMES[state.currentDay]}</b> — впишите вес и повторы в поля справа от каждого подхода
  </div>`;
  exercises.forEach((ex,exIdx)=>{
    const working=ex.sets.filter(s=>s.type==='рабочий').length;
    const exKey=`${state.currentDay}_${exIdx}`;
    const savedEx=saved?.exercises?.[exKey];
    const filled=isExercisePlanFilled(state.currentDay,exIdx);
    const prev = prevWorkoutSummary(state.currentDay, exIdx, dateKey);
    html+=`<div class="exercise-card">
      <div class="exercise-header"><h3>${ex.name}</h3><div class="meta">${ex.sets.length} подх. · ${working} раб.</div></div>`;
    if (prev) html+=`<div class="exercise-prev"><b>${formatDateShort(new Date(prev.date))}:</b> ${prev.text}</div>`;
    else html+=`<div class="exercise-prev" style="color:#555">Нет предыдущих тренировок этого дня</div>`;
    if(ex.note)html+=`<div class="exercise-note">${ex.note}</div>`;
    html+=`<div class="sets-header"><div></div><div></div><div>вес, кг</div><div>повт.</div></div>`;
    ex.sets.forEach((set,setIdx)=>{
      const setKey=`${exIdx}_${setIdx}`;
      const savedSet=savedEx?.[setKey];
      const actW=(savedSet?.w??'')===0?0:(savedSet?.w??'');
      const actR=savedSet?.r??'';
      html+=`<div class="set-row"><div class="set-num">${setIdx+1}</div>
        <div class="set-plan"><div>план <b>${set.planW}</b> × <b>${set.planR}</b> <span class="plan-type">${set.type}</span></div></div>
        <div class="set-input"><label>кг</label><input type="number" step="0.5" placeholder="—" value="${actW}"
          onchange="saveSet('${dateKey}','${exKey}','${setKey}','w',this.value)" oninput="saveSet('${dateKey}','${exKey}','${setKey}','w',this.value)"></div>
        <div class="set-input"><label>повт</label><input type="number" placeholder="—" value="${actR}"
          onchange="saveSet('${dateKey}','${exKey}','${setKey}','r',this.value)" oninput="saveSet('${dateKey}','${exKey}','${setKey}','r',this.value)"></div>
      </div>`;
    });
    html+=`<button class="copy-plan-btn ${filled?'clearing':''}" onclick="toggleExercisePlan(${state.currentDay},${exIdx})">${filled?'✕ Убрать план':'Вес как в плане'}</button></div>`;
  });
  document.getElementById('workoutArea').innerHTML=html;
}

function findPreviousWorkoutDate(day,currentDate){
  return Object.keys(state.history).filter(d=>state.history[d].day===day && d<currentDate).sort().reverse()[0]||null;
}

function saveSet(dateKey,exKey,setKey,field,value){
  if(!state.history[dateKey])state.history[dateKey]={day:state.currentDay,exercises:{}};
  if(!state.history[dateKey].exercises[exKey])state.history[dateKey].exercises[exKey]={};
  if(!state.history[dateKey].exercises[exKey][setKey])state.history[dateKey].exercises[exKey][setKey]={};
  const v=value===''?'':(field==='w'?parseFloat(value):parseInt(value));
  state.history[dateKey].exercises[exKey][setKey][field]=isNaN(v)?'':v;
  saveState();renderHeader();
}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}

// ===== EXCEL =====
const F={thin:{style:'thin',color:{rgb:'B0B0B0'}},med:{style:'medium',color:{rgb:'707070'}},borderAll:{top:{style:'thin',color:{rgb:'B0B0B0'}},bottom:{style:'thin',color:{rgb:'B0B0B0'}},left:{style:'thin',color:{rgb:'B0B0B0'}},right:{style:'thin',color:{rgb:'B0B0B0'}}},borderMed:{top:{style:'medium',color:{rgb:'707070'}},bottom:{style:'medium',color:{rgb:'707070'}},left:{style:'medium',color:{rgb:'707070'}},right:{style:'medium',color:{rgb:'707070'}}}};
function S(extra){return Object.assign({border:F.borderAll,font:{sz:11,name:'Calibri'},alignment:{vertical:'center'}},extra);}
function styleCell(ws,r,c,style){const addr=XLSX.utils.encode_cell({r,c});if(!ws[addr])ws[addr]={t:'s',v:''};ws[addr].s=style;}
function styleRow(ws,r,cols,style){for(let c=0;c<cols;c++)styleCell(ws,r,c,style);}
function titleStyle(){return S({font:{bold:true,sz:14,color:{rgb:'FFFFFF'}},fill:{fgColor:{rgb:'3F3F3F'}},alignment:{horizontal:'left',vertical:'center'},border:F.borderMed});}
function headerStyle(){return S({font:{bold:true,color:{rgb:'202020'}},fill:{fgColor:{rgb:'D9D9D9'}},alignment:{horizontal:'center',wrapText:true},border:F.borderMed});}
function yellowStyle(){return S({fill:{fgColor:{rgb:'FFF2CC'}}});}
function noteStyle(){return S({font:{italic:true,color:{rgb:'808080'},sz:10},alignment:{wrapText:true}});}
function boldStyle(){return S({font:{bold:true}});}
function finalizeSheet(ws,ref,cols){ws['!ref']=ref;ws['!cols']=cols;}

function exportExcel(){
  const wb=XLSX.utils.book_new();
  [1,2,3].forEach(d=>XLSX.utils.book_append_sheet(wb,buildDaySheet(d),`День ${d}`));
  XLSX.utils.book_append_sheet(wb,buildJournalSheet(),'Журнал подходов');
  XLSX.utils.book_append_sheet(wb,buildProgressSheet(),'Прогресс');
  XLSX.utils.book_append_sheet(wb,buildWeeksSheet(),'Недели');
  XLSX.utils.book_append_sheet(wb,buildFeelSheet(),'Самочувствие');
  XLSX.utils.book_append_sheet(wb,buildInBodySheet(),'InBody');
  XLSX.utils.book_append_sheet(wb,buildSnapSheet(),'Снимки');
  XLSX.utils.book_append_sheet(wb,buildSummarySheet(),'Сводка');
  XLSX.writeFile(wb,`plan_trenirovok_${formatDate(state.currentDate)}.xlsx`);
  showToast('Excel скачан');
}
function dayDates(dayNum){return Object.keys(state.history).filter(d=>state.history[d].day===dayNum).sort();}

function buildDaySheet(dayNum){
  const ex=state.plan[dayNum];
  const dates=dayDates(dayNum);
  const headers=['Упражнение','Подход','Тип','Вес, план','Повторения, план'];
  dates.forEach(d=>headers.push(`${formatDateShort(new Date(d))} вес`,`${formatDateShort(new Date(d))} повт.`));
  headers.push('След. вес','След. повт.','','Заметки');
  const rows=[[`День ${dayNum} · ${DAY_NAMES[dayNum]}`],[`Жёлтые ячейки — ввод после каждого подхода. «След.» — вес на следующую тренировку.`],headers];
  ex.forEach((e,exIdx)=>{
    e.sets.forEach((set,setIdx)=>{
      const row=[e.name,setIdx+1,set.type,set.planW,set.planR];
      dates.forEach(d=>{const s=state.history[d]?.exercises?.[`${dayNum}_${exIdx}`]?.[`${exIdx}_${setIdx}`];row.push(s?.w??'',s?.r??'');});
      row.push(set.planW,set.planR,'',exIdx===0?e.note:'');
      rows.push(row);
    });
  });
  const ws=XLSX.utils.aoa_to_sheet(rows);
  const cols=headers.length;
  ws['!merges']=[{s:{r:0,c:0},e:{r:0,c:cols-1}},{s:{r:1,c:0},e:{r:1,c:cols-1}}];
  styleRow(ws,0,cols,titleStyle());styleRow(ws,1,cols,noteStyle());styleRow(ws,2,cols,headerStyle());
  const yellowCols=[];
  dates.forEach((_,i)=>{yellowCols.push(5+i*2,6+i*2);});
  yellowCols.push(cols-4,cols-3);
  for(let r=3;r<rows.length;r++){
    styleRow(ws,r,cols,S({}));
    yellowCols.forEach(c=>styleCell(ws,r,c,yellowStyle()));
    if(rows[r][2]==='рабочий')styleCell(ws,r,2,boldStyle());
    styleCell(ws,r,cols-1,noteStyle());
    styleCell(ws,r,3,S({font:{bold:true}}));
    styleCell(ws,r,4,S({font:{bold:true}}));
  }
  finalizeSheet(ws,XLSX.utils.encode_range({s:{r:0,c:0},e:{r:rows.length-1,c:cols-1}}),
    [{wch:30},{wch:7},{wch:9},{wch:10},{wch:12},...dates.flatMap(()=>[{wch:9},{wch:9}]),{wch:9},{wch:10},{wch:2},{wch:40}]);
  return ws;
}

function buildJournalSheet(){
  const headers=['Дата','День','Упражнение','Подход','Тип','Вес, кг','Повторения','Объём, кг','План: вес','План: повторения'];
  const rows=[['Журнал подходов: все записи из дневника'],['Обновляется автоматически. Объём = вес × повторения по рабочим подходам.'],headers];
  Object.keys(state.history).sort().forEach(dateKey=>{
    const rec=state.history[dateKey];
    state.plan[rec.day].forEach((e,exIdx)=>{
      e.sets.forEach((set,setIdx)=>{
        const s=rec.exercises?.[`${rec.day}_${exIdx}`]?.[`${exIdx}_${setIdx}`];
        if(!s||(s.w===''||s.w==null)&&(s.r===''||s.r==null))return;
        const vol=(set.type==='рабочий'&&s.w&&s.r)?+(s.w*s.r).toFixed(1):0;
        rows.push([formatDateDisplay(new Date(dateKey)),`День ${rec.day} · ${DAY_NAMES[rec.day]}`,e.name,setIdx+1,set.type,s.w,s.r,vol,set.planW,set.planR]);
      });
    });
  });
  const ws=XLSX.utils.aoa_to_sheet(rows);
  ws['!merges']=[{s:{r:0,c:0},e:{r:0,c:9}},{s:{r:1,c:0},e:{r:1,c:9}}];
  styleRow(ws,0,10,titleStyle());styleRow(ws,1,10,noteStyle());styleRow(ws,2,10,headerStyle());
  for(let r=3;r<rows.length;r++){styleRow(ws,r,10,S({}));if(rows[r][4]==='рабочий')styleCell(ws,r,4,boldStyle());}
  finalizeSheet(ws,XLSX.utils.encode_range({s:{r:0,c:0},e:{r:rows.length-1,c:9}}),
    [{wch:12},{wch:14},{wch:30},{wch:7},{wch:9},{wch:9},{wch:10},{wch:11},{wch:10},{wch:12}]);
  return ws;
}

function buildProgressSheet(){
  const headers=['Упражнение','Рабочих подходов','Макс. вес, кг','Объём, кг','Первое занятие','Вес первого, кг','Последнее занятие','Вес последнего, кг','Изменение, кг'];
  const rows=[['Прогресс по упражнениям (рабочие подходы)'],['Изменение = вес последнего занятия минус вес первого.'],headers];
  [1,2,3].forEach(dayNum=>{
    state.plan[dayNum].forEach((e,exIdx)=>{
      const exKey=`${dayNum}_${exIdx}`;
      const dates=dayDates(dayNum);
      let maxW=0,vol=0,n=0,firstW=null,lastW=null,firstD=null,lastD=null;
      dates.forEach(d=>{e.sets.forEach((set,setIdx)=>{
        if(set.type!=='рабочий')return;
        const s=state.history[d]?.exercises?.[exKey]?.[`${exIdx}_${setIdx}`];
        if(!s||s.w===''||s.w==null)return;
        n++;vol+=s.w*(s.r||0);if(s.w>maxW)maxW=s.w;
        if(firstW===null){firstW=s.w;firstD=d;}lastW=s.w;lastD=d;
      });});
      if(!n)return;
      rows.push([e.name,n,maxW,+vol.toFixed(1),firstD?formatDateDisplay(new Date(firstD)):'',firstW,lastD?formatDateDisplay(new Date(lastD)):'',lastW,+(lastW-firstW).toFixed(1)]);
    });
  });
  const ws=XLSX.utils.aoa_to_sheet(rows);
  ws['!merges']=[{s:{r:0,c:0},e:{r:0,c:8}},{s:{r:1,c:0},e:{r:1,c:8}}];
  styleRow(ws,0,9,titleStyle());styleRow(ws,1,9,noteStyle());styleRow(ws,2,9,headerStyle());
  for(let r=3;r<rows.length;r++)styleRow(ws,r,9,S({}));
  finalizeSheet(ws,XLSX.utils.encode_range({s:{r:0,c:0},e:{r:rows.length-1,c:8}}),
    [{wch:32},{wch:14},{wch:12},{wch:11},{wch:14},{wch:12},{wch:14},{wch:14},{wch:12}]);
  return ws;
}

function buildWeeksSheet(){
  const rows=[['Недели: вес, вывод'],['Вес вводится утром; недели считаются от понедельника. Цель набора 0,15–0,35 кг в неделю.'],
    ['Неделя с (пн)','Вес ср., кг','Δ к пред. неделе','Дней с весом','Вывод','','','Дата','Вес утром, кг','','Пороги, кг/нед',''],

function importExcel(event){
  const file=event.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
      [1,2,3].forEach(dayNum=>{
        const ws=wb.Sheets[`День ${dayNum}`];if(!ws)return;
        const json=XLSX.utils.sheet_to_json(ws,{header:1});
        const headerRow=json.findIndex(r=>r[0]==='Упражнение');
        if(headerRow<0)return;
        const headers=json[headerRow];
        const dateCols={};
        headers.forEach((h,idx)=>{
          if(typeof h==='string'&&/^\d{2}\.\d{2}/.test(h)){
            const ds=h.split(' ')[0];const field=h.includes('повт')?'r':'w';
            if(!dateCols[ds])dateCols[ds]={};dateCols[ds][field]=idx;
          }
        });
        const nextW=headers.indexOf('След. вес'),nextR=headers.indexOf('След. повт.');
        json.slice(headerRow+1).forEach(row=>{
          if(!row[0])return;
          const exIdx=state.plan[dayNum].findIndex(x=>x.name===row[0]);
          if(exIdx===-1)return;
          const setIdx=(parseInt(row[1])||1)-1;
          if(!state.plan[dayNum][exIdx].sets[setIdx])return;
          if(nextW>=0&&row[nextW]!==undefined&&row[nextW]!=='')state.plan[dayNum][exIdx].sets[setIdx].planW=row[nextW];
          if(nextR>=0&&row[nextR]!==undefined&&row[nextR]!=='')state.plan[dayNum][exIdx].sets[setIdx].planR=row[nextR];
          Object.keys(dateCols).forEach(ds=>{
            const w=row[dateCols[ds].w],r=row[dateCols[ds].r];
            if(w===undefined||w==='')return;
            const [dd,mm]=ds.split('.').map(Number);
            const dt=new Date(new Date().getFullYear(),mm-1,dd);
            const dateKey=formatDate(dt);
            if(!state.history[dateKey])state.history[dateKey]={day:dayNum,exercises:{}};
            const exKey=`${dayNum}_${exIdx}`;
            if(!state.history[dateKey].exercises[exKey])state.history[dateKey].exercises[exKey]={};
            state.history[dateKey].exercises[exKey][`${exIdx}_${setIdx}`]={w:parseFloat(w),r:parseInt(r)};
          });
        });
      });
      state.planDate=formatDate(new Date());
      saveState();render();showToast('Excel загружен, план обновлён');
    }catch(err){showToast('Ошибка: '+err.message);}
  };
  reader.readAsArrayBuffer(file);
  event.target.value='';
}
