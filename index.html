// ===== ИНИЦИАЛИЗАЦИЯ =====
function init() {
  loadState();
  applySeedHistory();
  findCurrentDay();
  render();
}

function loadState() {
  try {
    const saved = localStorage.getItem('gymState');
    if (saved) {
      const parsed = JSON.parse(saved);
      state = { ...state, ...parsed };
      if (state.currentDate) state.currentDate = new Date(state.currentDate);
      // план всегда берём из кода (если не было импорта)
      if (!state.plan || !state.plan[1]) state.plan = JSON.parse(JSON.stringify(EXERCISES));
    }
  } catch(e) {}
}

function saveState() {
  try { localStorage.setItem('gymState', JSON.stringify(state)); } catch(e) {}
}

// Вшиваем историю Excel, не перетирая то, что уже вбито вручную
function applySeedHistory() {
  Object.keys(SEED_HISTORY).forEach(dateKey => {
    const seed = SEED_HISTORY[dateKey];
    if (!state.history[dateKey]) {
      state.history[dateKey] = { day: seed.day, exercises: {} };
    }
    seed.ex.forEach((setsArr, exIdx) => {
      const exKey = `${seed.day}_${exIdx}`;
      if (!state.history[dateKey].exercises[exKey]) state.history[dateKey].exercises[exKey] = {};
      setsArr.forEach((wr, setIdx) => {
        const setKey = `${exIdx}_${setIdx}`;
        const existing = state.history[dateKey].exercises[exKey][setKey];
        if (!existing || (existing.w === '' && existing.r === '')) {
          state.history[dateKey].exercises[exKey][setKey] = { w: wr[0], r: wr[1] };
        }
      });
    });
  });
  saveState();
}

function formatDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function formatDateDisplay(d) {
  return `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.${d.getFullYear()}`;
}
function formatDateShort(d) {
  return `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}`;
}

// Умный календарь: Пн=День1, Ср=День2, Пт=День3; остальные дни -> ближайший тренировочный вперёд
function findCurrentDay() {
  const d = new Date(state.currentDate);
  const dow = d.getDay();
  const map = {1:1, 3:2, 5:3};
  if (map[dow]) { state.currentDay = map[dow]; return; }
  const skip = {0:[1,1], 2:[1,2], 4:[1,3], 6:[2,1]}; // [дней_вперёд, номер дня]
  const s = skip[dow];
  d.setDate(d.getDate() + s[0]);
  state.currentDate = d;
  state.currentDay = s[1];
}

function navigateDay(dir) {
  const d = new Date(state.currentDate);
  d.setDate(d.getDate() + dir);
  state.currentDate = d;
  findCurrentDay();
  render();
}

function selectDay(n) { state.currentDay = n; render(); }

// ===== РЕНДЕР =====
function render() {
  renderHeader(); renderCalendar(); renderDayTabs(); renderWorkout(); saveState();
}

function renderHeader() {
  const d = new Date(state.planDate);
  const filled = !!state.history[formatDate(state.currentDate)];
  document.getElementById('planLabel').textContent =
    `План от ${formatDateShort(d)} · Excel ${filled ? 'заполнен' : 'не открыт'}`;
}

function renderCalendar() {
  const d = state.currentDate;
  document.getElementById('currentDate').textContent = formatDateDisplay(d);
  document.getElementById('currentWeekday').textContent = WEEKDAYS[d.getDay()];
}

function renderDayTabs() {
  const lastDates = {};
  Object.keys(state.history).sort().reverse().forEach(ds => {
    const day = state.history[ds].day;
    if (!lastDates[day]) lastDates[day] = ds;
  });
  const tabs = [1,2,3].map(n => {
    const lbl = lastDates[n] ? ` посл. ${formatDateShort(new Date(lastDates[n]))}` : '';
    return `<button class="day-tab ${n===state.currentDay?'active':''}" onclick="selectDay(${n})">День ${n}${lbl}</button>`;
  });
  document.getElementById('dayTabs').innerHTML = tabs.join('');
}

function renderWorkout() {
  const exercises = state.plan[state.currentDay];
  const dateKey = formatDate(state.currentDate);
  const saved = state.history[dateKey];
  const prevDate = findPreviousWorkoutDate(state.currentDay, dateKey);

  let html = `<div style="padding:12px 0 8px;font-size:14px;color:#888">
    <b style="color:#e5e5e5">${formatDateShort(state.currentDate)} · День ${state.currentDay}</b> — впишите вес и повторы в поля справа от каждого подхода
  </div>`;

  exercises.forEach((ex, exIdx) => {
    const working = ex.sets.filter(s=>s.type==='рабочий').length;
    const exKey = `${state.currentDay}_${exIdx}`;
    const savedEx = saved?.exercises?.[exKey];

    html += `<div class="exercise-card">
      <div class="exercise-header"><h3>${ex.name}</h3><div class="meta">${ex.sets.length} подх. · ${working} раб.</div></div>`;
    if (ex.note) html += `<div class="exercise-note">${ex.note}</div>`;
    html += `<div class="sets-header"><div></div><div></div><div>вес, кг</div><div>повт.</div></div>`;

    ex.sets.forEach((set, setIdx) => {
      const setKey = `${exIdx}_${setIdx}`;
      const savedSet = savedEx?.[setKey];
      const prevSet = prevDate ? getPreviousSet(prevDate, state.currentDay, exIdx, setIdx) : null;
      const prevDisplay = prevSet ? `${formatDateShort(new Date(prevDate))}: ${prevSet.w} × ${prevSet.r}` : '';
      const actW = (savedSet?.w ?? '') === 0 ? 0 : (savedSet?.w ?? '');
      const actR = savedSet?.r ?? '';

      html += `<div class="set-row">
        <div class="set-num">${setIdx+1}</div>
        <div class="set-plan">
          <div class="plan-main">план <b>${set.planW}</b> × <b>${set.planR}</b> <span class="plan-type">${set.type}</span></div>
          ${prevDisplay ? `<div class="plan-prev">${prevDisplay}</div>` : ''}
        </div>
        <div class="set-input"><label>кг</label>
          <input type="number" step="0.5" placeholder="—" value="${actW}"
            onchange="saveSet('${dateKey}','${exKey}','${setKey}','w',this.value)"
            oninput="saveSet('${dateKey}','${exKey}','${setKey}','w',this.value)"></div>
        <div class="set-input"><label>повт</label>
          <input type="number" placeholder="—" value="${actR}"
            onchange="saveSet('${dateKey}','${exKey}','${setKey}','r',this.value)"
            oninput="saveSet('${dateKey}','${exKey}','${setKey}','r',this.value)"></div>
      </div>`;
    });
    html += `<button class="copy-plan-btn" onclick="copyPlanForExercise(${state.currentDay},${exIdx})">Вес как в плане</button></div>`;
  });
  document.getElementById('workoutArea').innerHTML = html;
}

function findPreviousWorkoutDate(day, currentDate) {
  return Object.keys(state.history).filter(d => state.history[d].day === day && d < currentDate).sort().reverse()[0] || null;
}
function getPreviousSet(prevDate, day, exIdx, setIdx) {
  return state.history[prevDate]?.exercises?.[`${day}_${exIdx}`]?.[`${exIdx}_${setIdx}`] || null;
}

// ===== СОХРАНЕНИЕ =====
function saveSet(dateKey, exKey, setKey, field, value) {
  if (!state.history[dateKey]) state.history[dateKey] = { day: state.currentDay, exercises: {} };
  if (!state.history[dateKey].exercises[exKey]) state.history[dateKey].exercises[exKey] = {};
  if (!state.history[dateKey].exercises[exKey][setKey]) state.history[dateKey].exercises[exKey][setKey] = {};
  const v = value === '' ? '' : (field==='w' ? parseFloat(value) : parseInt(value));
  state.history[dateKey].exercises[exKey][setKey][field] = isNaN(v) ? '' : v;
  saveState(); renderHeader();
}

function fillPlanFor(dateKey, dayNum, exIdx, ex) {
  if (!state.history[dateKey]) state.history[dateKey] = { day: dayNum, exercises: {} };
  const exKey = `${dayNum}_${exIdx}`;
  if (!state.history[dateKey].exercises[exKey]) state.history[dateKey].exercises[exKey] = {};
  ex.sets.forEach((set, setIdx) => {
    state.history[dateKey].exercises[exKey][`${exIdx}_${setIdx}`] = {
      w: set.planW === 'свой вес' ? '' : set.planW,
      r: typeof set.planR === 'number' ? set.planR : parseInt(String(set.planR).split('–')[0])
    };
  });
}
function copyPlanForExercise(dayNum, exIdx) {
  fillPlanFor(formatDate(state.currentDate), dayNum, exIdx, state.plan[dayNum][exIdx]);
  saveState(); render(); showToast('Веса из плана заполнены');
}
function copyPlanWeights() {
  const dateKey = formatDate(state.currentDate);
  state.plan[state.currentDay].forEach((ex, i) => fillPlanFor(dateKey, state.currentDay, i, ex));
  saveState(); render(); showToast('Все веса из плана заполнены');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// ===== ЭКСПОРТ EXCEL (формат как в исходном файле) =====
function exportExcel() {
  const wb = XLSX.utils.book_new();
  [1,2,3].forEach(dayNum => {
    const data = buildDaySheet(dayNum);
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(data), `День ${dayNum}`);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(buildJournalSheet()), 'Журнал подходов');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(buildProgressSheet()), 'Прогресс');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(buildWeeksSheet()), 'Недели');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(buildSummarySheet()), 'Сводка');
  XLSX.writeFile(wb, `plan_trenirovok_${formatDate(state.currentDate)}.xlsx`);
  showToast('Excel скачан');
}

function dayDates(dayNum) {
  return Object.keys(state.history).filter(d => state.history[d].day === dayNum).sort();
}

function buildDaySheet(dayNum) {
  const exercises = state.plan[dayNum];
  const dates = dayDates(dayNum);
  const headers = ['Упражнение','Подход','Тип','Вес, план','Повторения, план'];
  dates.forEach(d => { headers.push(`${formatDateShort(new Date(d))} вес`, `${formatDateShort(new Date(d))} повт.`); });
  headers.push('', 'Заметки');
  const data = [headers];
  exercises.forEach((ex, exIdx) => {
    const exKey = `${dayNum}_${exIdx}`;
    ex.sets.forEach((set, setIdx) => {
      const row = [ex.name, setIdx+1, set.type, set.planW, set.planR];
      dates.forEach(d => {
        const s = state.history[d]?.exercises?.[exKey]?.[`${exIdx}_${setIdx}`];
        row.push(s?.w ?? '', s?.r ?? '');
      });
      row.push('', exIdx === 0 ? ex.note : '');
      data.push(row);
    });
  });
  return data;
}

function buildJournalSheet() {
  const data = [['Дата','День','Упражнение','Подход','Тип','Вес, кг','Повторения','Объём, кг','План: вес','План: повторения']];
  Object.keys(state.history).sort().forEach(dateKey => {
    const rec = state.history[dateKey];
    state.plan[rec.day].forEach((ex, exIdx) => {
      ex.sets.forEach((set, setIdx) => {
        const s = rec.exercises?.[`${rec.day}_${exIdx}`]?.[`${exIdx}_${setIdx}`];
        if (!s) return;
        const w = s.w, r = s.r;
        const vol = (set.type==='рабочий' && w && r) ? w*r : 0;
        data.push([formatDateDisplay(new Date(dateKey)), `День ${rec.day}`, ex.name, setIdx+1, set.type, w, r, vol, set.planW, set.planR]);
      });
    });
  });
  return data;
}

function buildProgressSheet() {
  const data = [['Упражнение','Рабочих подходов','Макс. вес, кг','Объём, кг','Первое занятие','Вес первого, кг','Последнее занятие','Вес последнего, кг','Изменение, кг']];
  [1,2,3].forEach(dayNum => {
    state.plan[dayNum].forEach((ex, exIdx) => {
      const exKey = `${dayNum}_${exIdx}`;
      const dates = dayDates(dayNum);
      let maxW=0, vol=0, n=0, firstW=null, lastW=null, firstD=null, lastD=null;
      dates.forEach(d => {
        ex.sets.forEach((set, setIdx) => {
          if (set.type!=='рабочий') return;
          const s = state.history[d]?.exercises?.[exKey]?.[`${exIdx}_${setIdx}`];
          if (!s || s.w === '' || s.w == null) return;
          n++; vol += s.w*(s.r||0); if (s.w>maxW) maxW=s.w;
          if (firstW===null){firstW=s.w;firstD=d;}
          lastW=s.w; lastD=d;
        });
      });
      if (!n) return;
      data.push([ex.name, n, maxW, vol, firstD?formatDateDisplay(new Date(firstD)):'', firstW, lastD?formatDateDisplay(new Date(lastD)):'', lastW, (lastW!=null&&firstW!=null)?+(lastW-firstW).toFixed(1):'']);
    });
  });
  return data;
}

function buildWeeksSheet() {
  return [['Неделя с (пн)','Вес ср., кг','Δ к пред. неделе','Дней с весом','Ккал ср.','Белок ср., г','Дней с едой','Вывод'],
    ['23.11.2026','','','','','','','ждёт данных']];
}

function buildSummarySheet() {
  return [
    ['План тренировок: 3 дня в неделю, цель — рост мышц'],
    [],
    ['День','Фокус','Всего подходов','Рабочих подходов','День недели'],
    ['День 1','Низ: ноги', state.plan[1].reduce((s,e)=>s+e.sets.length,0), state.plan[1].reduce((s,e)=>s+e.sets.filter(x=>x.type==='рабочий').length,0), 'понедельник'],
    ['День 2','Верх A: грудь, спина, плечи', state.plan[2].reduce((s,e)=>s+e.sets.length,0), state.plan[2].reduce((s,e)=>s+e.sets.filter(x=>x.type==='рабочий').length,0), 'среда'],
    ['День 3','Верх B: плечи, руки', state.plan[3].reduce((s,e)=>s+e.sets.length,0), state.plan[3].reduce((s,e)=>s+e.sets.filter(x=>x.type==='рабочий').length,0), 'пятница'],
    [],
    ['Как заполнять и корректировать веса'],
    ['Если во всех рабочих подходах набрана верхняя граница повторений — следующая ступень веса.'],
    ['Если в первом рабочем подходе не набралась нижняя граница — снизить вес на 5–10%.'],
    ['Отдых: 2–3 мин на базе, 60–90 сек на изоляции. Разгрузка раз в 6–8 недель.']
  ];
}

// ===== ИМПОРТ EXCEL =====
function importExcel(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const wb = XLSX.read(new Uint8Array(e.target.result), {type:'array'});
      [1,2,3].forEach(dayNum => {
        const ws = wb.Sheets[`День ${dayNum}`];
        if (!ws) return;
        const json = XLSX.utils.sheet_to_json(ws, {header:1});
        if (json.length < 2) return;
        const headers = json[0];
        const dateCols = {};
        headers.forEach((h, idx) => {
          if (typeof h === 'string' && /^\d{2}\.\d{2}/.test(h)) {
            const ds = h.split(' ')[0];
            const field = h.includes('повт') ? 'r' : 'w';
            if (!dateCols[ds]) dateCols[ds] = {};
            dateCols[ds][field] = idx;
          }
        });
        json.slice(1).forEach(row => {
          if (!row[0]) return;
          const exIdx = state.plan[dayNum].findIndex(x => x.name === row[0]);
          if (exIdx === -1) return;
          const setIdx = (parseInt(row[1])||1) - 1;
          if (row[3] !== undefined && row[3] !== '') state.plan[dayNum][exIdx].sets[setIdx].planW = row[3];
          if (row[4] !== undefined && row[4] !== '') state.plan[dayNum][exIdx].sets[setIdx].planR = row[4];
          Object.keys(dateCols).forEach(ds => {
            const w = row[dateCols[ds].w], r = row[dateCols[ds].r];
            if (w === undefined || w === '') return;
            const [dd, mm] = ds.split('.').map(Number);
            const dt = new Date(new Date().getFullYear(), mm-1, dd);
            const dateKey = formatDate(dt);
            if (!state.history[dateKey]) state.history[dateKey] = { day: dayNum, exercises: {} };
            const exKey = `${dayNum}_${exIdx}`;
            if (!state.history[dateKey].exercises[exKey]) state.history[dateKey].exercises[exKey] = {};
            state.history[dateKey].exercises[exKey][`${exIdx}_${setIdx}`] = { w: parseFloat(w), r: parseInt(r) };
          });
        });
      });
      state.planDate = formatDate(new Date());
      saveState(); render();
      showToast('Excel загружен, план обновлён');
    } catch(err) { showToast('Ошибка: ' + err.message); }
  };
  reader.readAsArrayBuffer(file);
  event.target.value = '';
}

init();
</script>
