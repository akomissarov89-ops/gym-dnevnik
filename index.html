<!DOCTYPE html>
<!--
═══════════════════════════════════════════════════════════════════════════════
  ДНЕВНИК ТРЕНИРОВОК · PWA для iPhone (проверено на раскладке 16 Pro Max)
═══════════════════════════════════════════════════════════════════════════════

  ЧТО ЭТО
  Один самодостаточный index.html. Кладётся в корень репозитория
  akomissarov89-ops/gym-dnevnik → Settings → Pages → main / (root).
  На iPhone: Safari → «Поделиться» → «На экран Домой» — открывается
  полноэкранно, без адресной строки, с иконкой-гантелью.

  СТЕК (без сборки, без фреймворков)
  · Ванильный JS + один внешний скрипт xlsx-js-style (единственная зависимость,
    нужна потому что обычный SheetJS не умеет стили ячеек).
  · Состояние — один объект S, целиком сериализуется в localStorage.
    Никаких competing sources of state: DOM всегда перерисовывается из S.
  · Иконка приложения рисуется на <canvas> в PNG data-URI (iOS не принимает
    SVG для apple-touch-icon), тот же путь гантели, что в шапке.

  ГДЕ ДАННЫЕ
  localStorage['gymDiary.v8']. GitHub хранит только код, не тренировки.
  Резервная копия = кнопка XLS (выгрузка Excel) и импорт того же файла.

  РЕАЛИЗОВАННЫЕ ТРЕБОВАНИЯ (помечены в коде тегом [ТЗ])
  1  Свайп вниз закрывает всплывающие шторки.
  2  Календарь — уменьшенные овалы, горизонтальный скролл влево-вправо.
  3  «Вес как в плане» ставит вес и ВЕРХНЮЮ границу повторений.
  4  Конец отдыха = звук + вибрация + системное уведомление.
  5  Экран не гаснет, пока приложение открыто (Screen Wake Lock).
  6  Строка поиска/фильтров/видов удалена полностью.
  7  Убрано мигание рамки при заполнении плана (точечная перекраска DOM).
  8  Разминка и рабочие подходы одного тона.
  9  Овалы дней и «Отдых» — одинаковая ширина.
  10 Иконка на рабочем столе — гантель из левого верхнего угла.
  11 Вкладка «Самочувствие»: сон, усталость, суставы, длительность по часам.
  12 Питание удалено целиком: ни состояния, ни листа в Excel.
  13 В Excel упражнения визуально отделены друг от друга.
  14 Лист «Снимки» удалён (фото присылаются в чат, данные вносятся руками).
  15 Во всём Excel текст читается: переносы, ширины, авто-высота строк.

  ЧТО СОХРАНЕНО ИЗ ПРЕЖНИХ ВЕРСИЙ
  Календарь на каждый день + автоподбор Пн/Ср/Пт + ручное назначение за датой;
  предыдущие значения под КАЖДЫМ подходом; названия дней; таймер отдыха;
  undo после разрушающих действий; перетаскивание упражнений; разбор тренера;
  импорт/экспорт Excel с жёлтыми ячейками ввода и полными границами.
═══════════════════════════════════════════════════════════════════════════════
-->
<html lang="ru">
<head>
<meta charset="UTF-8">
<!-- viewport-fit=cover — контент уходит под Dynamic Island, отступы берём из env() -->
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- black-translucent: статус-бар прозрачный, шапка сплошная — верх не «затеняется» -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Дневник">
<meta name="theme-color" content="#0b0e10">
<title>Дневник тренировок</title>
<!-- href заполняются на старте из makeIcon() — см. setIcons() -->
<link id="touchIcon" rel="apple-touch-icon" href="">
<link id="manifestLink" rel="manifest" href="">
<style>
/* ═══ ПАЛИТРА: 8 рабочих оттенков + 4 нейтральных слоя ═══════════════════════
   Доминанта — графит/сталь (зал, блины, гриф). Акценты взяты из предметов:
   лайм = прогресс/PR, циан = авто-режим и таймер, янтарь = откат/внимание,
   фиолет = восстановление, красный = опасность и зона «Экстрим»,
   зелёный = успех и зона «Жир», песок = заметки. Оранжевый/жёлтый — зоны пульса.
   Нейтрали разделены по слоям: bg → surf → overlay → scrim. */
:root{
  --bg:#07080a;--bg2:#0a0c0e;--surf:#101316;--surf2:#161a1e;--surf3:#1d2227;--overlay:#1b2126;
  --line:#232a30;--line2:#2f383f;--scrim:rgba(3,4,6,.8);
  --txt:#eef2f5;--txt2:#a3adb5;--txt3:#717c85;--txt4:#4d575f;
  --lime:#c8f24e;--lime-d:#9dc72f;--cyan:#45cdf2;--amber:#f2b544;
  --red:#f2685c;--violet:#a78bfa;--green:#5fd68b;--sand:#d9c9a6;
  --orange:#f2913c;--yellow:#f2d144;
  --mono:ui-monospace,'SF Mono',SFMono-Regular,Menlo,'Roboto Mono',monospace;
  --sans:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
/* Каркас: flex-колонка на 100dvh. Шапка и док — flex:none, контент — flex:1.
   Благодаря этому док НЕ fixed и не перекрывает контент, а низ всегда достигнут. */
body{height:100dvh;min-height:100vh;overflow:hidden;overscroll-behavior:none;font-family:var(--sans);color:var(--txt);
  -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);
  background:radial-gradient(1100px 620px at 8% -12%,rgba(200,242,78,.07),transparent 60%),
    radial-gradient(900px 560px at 104% 2%,rgba(69,205,242,.055),transparent 58%),
    radial-gradient(1000px 700px at 50% 116%,rgba(167,139,250,.06),transparent 60%),var(--bg)}
/* Скроллбар в палитре артефакта, а не системный */
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:#0a0c0e}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--lime-d),#2f89a6);border-radius:9px;border:2px solid #0a0c0e}
::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,var(--lime),var(--cyan))}
*{scrollbar-width:thin;scrollbar-color:var(--lime-d) #0a0c0e}
button,input,textarea{font-family:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
svg{display:block}

/* ═══ ШАПКА — сплошной фон, без backdrop-filter: верх никогда не темнеет ═══ */
.hdr{flex:none;background:#0b0e10;border-bottom:1px solid var(--line);position:relative;z-index:6}
.hdr::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--lime),var(--cyan) 46%,var(--violet));opacity:.85}
.hdr-main{display:flex;align-items:center;gap:5px;padding:8px 12px 6px}
.mark{width:28px;height:28px;border-radius:9px;flex:none;display:grid;place-items:center;background:linear-gradient(145deg,#1d2418,#101413);border:1px solid #2c3524}
.mark svg{width:16px;height:16px;stroke:var(--lime);fill:none;stroke-width:2.2;stroke-linecap:round}
.hnav{width:30px;height:36px;flex:none;border-radius:10px;background:var(--surf2);border:1px solid var(--line2);display:grid;place-items:center;font-size:17px;color:var(--txt);transition:.14s}
.hnav:active{transform:scale(.9);color:var(--lime);border-color:var(--lime-d)}
.hdate{flex:1;min-width:0;text-align:center;padding:1px;border-radius:10px;line-height:1.15}
.hdate:active{background:var(--surf2)}
.hdate .d{font-size:15px;font-weight:650;letter-spacing:.3px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdate .w{font-size:10px;color:var(--txt2);display:flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap;overflow:hidden;margin-top:1px}
/* Бейдж источника назначения: авто / вручную / записано — всегда виден в шапке */
.src{font-weight:800;letter-spacing:.3px;text-transform:uppercase;font-size:8px;padding:1px 4px;border-radius:4px}
.src.auto{color:var(--cyan);background:rgba(69,205,242,.15)}
.src.manual{color:var(--amber);background:rgba(242,181,68,.16)}
.src.logged{color:var(--lime);background:rgba(200,242,78,.15)}
.today-jump{color:var(--cyan);font-weight:700;text-decoration:underline;text-underline-offset:2px}
.hact{display:flex;gap:4px;flex:none}
.ib{width:30px;height:36px;border-radius:10px;background:var(--surf2);border:1px solid var(--line2);display:grid;place-items:center;font-size:13px;color:var(--txt2);transition:.14s;position:relative}
.ib:active{transform:scale(.9)}
.ib.on{color:var(--lime);border-color:#3d4a2c;background:rgba(200,242,78,.1)}
.ib.off{color:var(--txt4)}
.ib.lime{background:linear-gradient(135deg,var(--lime),#a8e02f);color:#0a0c07;border-color:transparent;font-size:10.5px;font-weight:800;width:38px}
.ib svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib .chev{transition:transform .25s;font-size:11px}
body.cal-collapsed .ib .chev{transform:rotate(180deg)}

/* ═══ [ТЗ-2] КАЛЕНДАРЬ: мелкие овалы 40×34, горизонтальный скролл ══════════
   49 дней (−14…+34 от понедельника текущей недели). scroll-snap центрирует
   овалы, выбранный день сам подъезжает в центр через scrollIntoView. */
.cal-wrap{padding:0 0 6px;position:relative}
body.cal-collapsed .cal-wrap{display:none}   /* шеврон в шапке сворачивает ленту */
.cal{display:flex;gap:5px;overflow-x:auto;padding:2px 12px 5px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.cal::-webkit-scrollbar{height:4px}          /* тонкий лайм-циановый ползунок */
.cal::-webkit-scrollbar-track{background:#0e1114;border-radius:4px}
.cal::-webkit-scrollbar-thumb{background:linear-gradient(90deg,var(--lime-d),var(--cyan));border-radius:4px;border:none}
.cd{flex:none;width:40px;height:34px;border-radius:12px;background:var(--surf);border:1px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;scroll-snap-align:center;transition:.14s}
.cd:active{transform:scale(.92)}
.cd .n{font-size:7px;color:var(--txt4);text-transform:uppercase;letter-spacing:.4px;font-weight:800;line-height:1}
.cd .num{font-size:12px;font-weight:650;color:var(--txt2);font-family:var(--mono);line-height:1.1}
.cd .mk{height:2.5px;width:11px;border-radius:2px;background:transparent}
.cd.plan .mk{background:#2d353b}                                    /* запланирована */
.cd.logged .mk{background:linear-gradient(90deg,var(--lime),var(--lime-d));box-shadow:0 0 6px rgba(200,242,78,.45)} /* есть факт */
.cd.rest .mk{background:#3b3452}                                    /* отдых */
.cd.sel{background:linear-gradient(160deg,#212a19,#141a19);border-color:var(--lime-d)}
.cd.sel .num,.cd.sel .n{color:var(--lime)}
.cd.is-today .num{color:var(--cyan)}
.cd.is-today.sel .num{color:var(--lime)}

/* ═══ ВКЛАДКИ: Тренировка / Самочувствие ══════════════════════════════════ */
.tabs{display:flex;gap:5px;padding:0 12px 6px}
.tab{flex:1;height:30px;border-radius:10px;background:var(--surf);border:1px solid var(--line);font-size:11.5px;font-weight:750;color:var(--txt3);display:flex;align-items:center;justify-content:center;gap:5px;transition:.15s}
.tab:active{transform:scale(.97)}
.tab.on{background:linear-gradient(135deg,#f3f7ee,#dfe8d5);border-color:#f3f7ee;color:#0d100b}
.tab .bdg{font-size:8.5px;font-weight:800;padding:1px 4px;border-radius:4px;background:rgba(69,205,242,.16);color:var(--cyan)}
.tab.on .bdg{background:rgba(13,16,11,.12);color:#0d100b}

/* ═══ [ТЗ-9] ОВАЛЫ ДНЕЙ: flex:1 1 0 → все четыре одной ширины ═════════════ */
.chips{display:flex;gap:5px;padding:0 12px 8px}
body.tab-feel .chips{display:none}          /* на вкладке самочувствия день не нужен */
.chip{flex:1 1 0;min-width:0;height:32px;border-radius:16px;background:var(--surf);border:1px solid var(--line);
  font-size:11.5px;font-weight:700;color:var(--txt2);display:flex;align-items:center;justify-content:center;gap:3px;transition:.14s;padding:0 4px}
.chip:active{transform:scale(.95)}
.chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .cn{font-weight:850;color:var(--txt);flex:none}
.chip.on{background:linear-gradient(135deg,#f3f7ee,#dfe8d5);border-color:#f3f7ee;color:#0d100b}
.chip.on .cn{color:#0d100b}
.chip.on.rest{background:linear-gradient(135deg,#cfbcff,#a78bfa);border-color:#a78bfa;color:#170f2b}
.chip.on.rest .cn{color:#170f2b}

/* ═══ КОНТЕНТ ═════════════════════════════════════════════════════════════ */
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;position:relative;z-index:2;padding:0 12px 14px;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column}
#content{flex:1;display:flex;flex-direction:column;min-height:0}
#content.list{display:block}
.sess-line{display:flex;align-items:center;gap:7px;padding:9px 0 9px}
.sess-line .t{font-size:14px;font-weight:750;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sess-line .s{font-size:11px;color:var(--txt3);font-family:var(--mono);flex:none}
.sess-line .vol{margin-left:auto;font-size:11px;color:var(--lime);font-family:var(--mono);font-weight:700;flex:none}
.sess-line .an{flex:none;width:26px;height:26px;border-radius:8px;background:rgba(200,242,78,.12);border:1px solid #33402a;color:var(--lime);display:grid;place-items:center;font-size:12px}
.card{background:linear-gradient(170deg,var(--surf) 0%,#0d1013 100%);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden;position:relative}
/* [ТЗ-7] Анимация появления только при смене даты/вкладки (класс .anim).
   При заполнении плана карточки не пересоздаются → ничего не мигает. */
.anim .card{animation:rise .38s cubic-bezier(.2,.7,.3,1) backwards;animation-delay:calc(var(--i)*26ms)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card.dragging{opacity:.92;z-index:9;box-shadow:0 16px 40px rgba(0,0,0,.6);border-color:var(--lime-d)}
.card.drop-before::after,.card.drop-after::after{content:'';position:absolute;left:6px;right:6px;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--lime),var(--cyan));box-shadow:0 0 10px rgba(200,242,78,.6)}
.card.drop-before::after{top:-7px}.card.drop-after::after{bottom:-7px}
.card-h{display:flex;align-items:center;gap:7px;padding:12px 12px 10px;width:100%;text-align:left}
.grip{flex:none;width:20px;height:28px;display:grid;place-items:center;color:var(--txt4);touch-action:none;border-radius:7px}
.grip:active{color:var(--lime);background:rgba(200,242,78,.08)}
.grip svg{width:11px;height:15px;fill:currentColor}
.card-h .tt{flex:1;min-width:0;display:flex;align-items:center;gap:7px;text-align:left}
.card-h h3{font-size:14.5px;font-weight:750;letter-spacing:-.2px;line-height:1.25}
.card-h .m{font-size:10px;color:var(--txt4);white-space:nowrap;display:flex;align-items:center;gap:3px}
.card-h .m svg{stroke:var(--txt4);width:10px;height:10px;fill:none;stroke-width:2.4}
.trend{flex:none;font-size:9px;font-weight:800;padding:2px 5px;border-radius:5px;font-family:var(--mono)}
.trend.up{color:var(--lime);background:rgba(200,242,78,.13)}
.trend.hold{color:var(--cyan);background:rgba(69,205,242,.13)}
.trend.down{color:var(--amber);background:rgba(242,181,68,.13)}
.note{padding:0 12px 9px 39px;font-size:11px;color:var(--sand);line-height:1.45;opacity:.85}
.sh{display:grid;grid-template-columns:24px 1fr 60px 60px;gap:6px;padding:5px 12px;font-size:9px;color:var(--txt4);letter-spacing:.8px;text-transform:uppercase;font-weight:800}
.sh>:nth-child(3),.sh>:nth-child(4){text-align:center}
/* [ТЗ-8] У подхода НЕТ класса .warm и нет opacity — разминка и рабочий
   выглядят одинаково; различие только словом «разминка» в строке плана. */
.set{display:grid;grid-template-columns:24px 1fr 60px 60px;gap:6px;padding:9px 12px;align-items:center;border-top:1px solid #191e22;position:relative}
.set:nth-of-type(even){background:rgba(255,255,255,.014)}
.set::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent;transition:background .2s}
.set.hit::before{background:linear-gradient(180deg,var(--lime),var(--lime-d))}   /* верхняя граница взята */
.set.miss::before{background:linear-gradient(180deg,var(--amber),var(--red))}    /* ниже нижней границы */
.idx{font-size:13px;color:var(--txt4);font-weight:650;font-family:var(--mono);transition:color .2s}
.set.done .idx{color:var(--lime)}
.pinfo{min-width:0;line-height:1.42}
.pl{font-size:12.5px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px}
.pl .w{color:var(--txt3)}.pl b{color:var(--txt);font-weight:750}
.pl .tag{font-size:9.5px;color:var(--txt4);font-family:var(--sans)}
/* предыдущая тренировка — под КАЖДЫМ подходом, как в исходном дневнике */
.pv{font-size:10.5px;color:var(--txt3);margin-top:1px;display:flex;align-items:center;gap:5px}
.pv .delta{font-size:9.5px;font-weight:800;padding:0 4px;border-radius:4px}
.pv .up{color:var(--lime);background:rgba(200,242,78,.12)}
.pv .dn{color:var(--amber);background:rgba(242,181,68,.12)}
/* [ТЗ-7] transition только на border-color/color — без вспышки фона и layout */
.inp{width:100%;height:38px;background:#1b2024;border:1px solid #30383e;border-radius:10px;text-align:center;font-size:14px;font-weight:750;outline:none;font-family:var(--mono);color:var(--txt);-moz-appearance:textfield;transition:border-color .15s,color .15s}
.inp::-webkit-outer-spin-button,.inp::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.inp::placeholder{color:#48525a;font-weight:600;font-size:11px}
.inp:focus{border-color:var(--lime)}
.inp.has{border-color:#414d33;color:var(--lime)}
.card-f{display:flex;border-top:1px solid #191e22}
.card-f button{flex:1;padding:11px 12px;font-size:12.5px;font-weight:700;color:var(--lime);text-align:right}
.card-f button:active{background:rgba(200,242,78,.06)}
.card-f button.clear{color:var(--red)}
.card-f .mini{flex:none;text-align:left;color:var(--txt3);font-size:11.5px}
.endcap{text-align:center;font-size:10.5px;color:var(--txt4);padding:6px 0 2px;font-family:var(--mono);letter-spacing:.6px}

/* ═══ [ТЗ-11] ВКЛАДКА САМОЧУВСТВИЕ ═══════════════════════════════════════
   Три шкалы 1–5 (сон / усталость / суставы) + блок часов, где длительность
   берётся с экрана HUAWEI, плюс зоны пульса и заметка. Всё пишется в S.feel
   и S.watch и уходит в листы «Самочувствие» и «Часы». */
.fsec{background:linear-gradient(170deg,var(--surf),#0d1013);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:10px}
.fsec-h{display:flex;align-items:center;gap:8px;margin-bottom:11px}
.fsec-h .ic{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;font-size:12px;flex:none}
.fsec-h b{font-size:12.5px;font-weight:750;flex:1;min-width:0}
.fsec-h .hint{font-size:9.5px;color:var(--txt4);font-family:var(--mono)}
.scale{margin-bottom:11px}
.scale:last-child{margin-bottom:0}
.scale .lb{display:flex;align-items:baseline;gap:6px;margin-bottom:6px}
.scale .lb b{font-size:11.5px;font-weight:700}
.scale .lb i{font-size:9.5px;color:var(--txt4);font-style:normal;margin-left:auto;font-family:var(--mono)}
.pills{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.pill{height:34px;border-radius:10px;background:#1b2024;border:1px solid #30383e;font-size:13px;font-weight:800;font-family:var(--mono);color:var(--txt3);transition:.14s}
.pill:active{transform:scale(.94)}
/* цвет оценки совпадает с семантикой: 1 отлично → 5 плохо */
.pill.on{color:#0a0c07;border-color:transparent}
.pill.on[data-v="1"]{background:var(--lime)}
.pill.on[data-v="2"]{background:var(--green)}
.pill.on[data-v="3"]{background:var(--yellow)}
.pill.on[data-v="4"]{background:var(--orange)}
.pill.on[data-v="5"]{background:var(--red)}
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label{font-size:8.5px;color:var(--txt4);text-transform:uppercase;letter-spacing:.6px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fld input{height:38px;background:#1b2024;border:1px solid #30383e;border-radius:10px;text-align:center;font-size:13.5px;font-weight:750;font-family:var(--mono);outline:none;-moz-appearance:textfield;transition:border-color .15s}
.fld input::-webkit-outer-spin-button,.fld input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.fld input:focus{border-color:var(--lime)}
.fld input.has{border-color:#414d33;color:var(--lime)}
.fnote{width:100%;min-height:74px;background:#14181b;border:1px solid var(--line2);border-radius:11px;padding:11px;font-size:12.5px;line-height:1.5;outline:none;resize:vertical;font-family:var(--sans)}
.fnote:focus{border-color:var(--lime-d)}
.zonegrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.zonegrid .fld label{display:flex;align-items:center;gap:3px}
.zonegrid .dot{width:6px;height:6px;border-radius:50%;flex:none}
.ftable{width:100%;border-collapse:collapse;font-size:11px}
.ftable th{text-align:left;font-size:8.5px;color:var(--txt4);text-transform:uppercase;letter-spacing:.6px;padding:0 6px 7px 0;font-weight:800;border-bottom:1px solid var(--line)}
.ftable td{padding:8px 6px 8px 0;border-bottom:1px solid #181d21;font-family:var(--mono);color:var(--txt2)}
.ftable td:first-child{color:var(--txt);font-weight:700}
.ftable tr:last-child td{border-bottom:none}
.ftable .ok{color:var(--lime)}.ftable .warn{color:var(--amber)}
.overload{display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:11px;font-size:11.5px;line-height:1.4}
.overload.no{background:rgba(95,214,139,.09);border:1px solid #2c4436;color:var(--green)}
.overload.yes{background:rgba(242,104,92,.1);border:1px solid #4a2f2c;color:var(--red)}
.overload b{font-weight:800}

/* ═══ ДЕНЬ ОТДЫХА: растягивается на всю высоту, низ не пустует ═══════════ */
.rest{flex:1;display:flex;flex-direction:column;gap:clamp(10px,1.8vh,18px);border-radius:18px;padding:clamp(16px,2.4vh,26px) 16px;position:relative;overflow:hidden;background:linear-gradient(163deg,#1b1732 0%,#131420 46%,#0e1015 100%);border:1px solid #2c2647}
.rest::before{content:'';position:absolute;inset:-30% -20% auto;height:320px;pointer-events:none;background:radial-gradient(closest-side,rgba(167,139,250,.2),transparent)}
.rest-hero{text-align:center;position:relative}
.moon{width:clamp(48px,6.4vh,68px);height:clamp(48px,6.4vh,68px);margin:0 auto 11px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(145deg,#2b2452,#1a1731);border:1px solid #3c3266;box-shadow:0 0 30px rgba(167,139,250,.2)}
.moon svg{width:46%;height:46%;stroke:var(--violet);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.rest h2{font-size:clamp(17px,2.4vh,22px);font-weight:800;letter-spacing:-.3px}
.rest-hero p{font-size:12px;color:var(--txt2);margin:6px auto 0;line-height:1.55;max-width:330px}
.tips{flex:1;display:grid;grid-template-columns:1fr;gap:8px;align-content:stretch;position:relative}
.tip{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.035);border:1px solid #2b2542;border-radius:12px;padding:11px 12px;text-align:left;transition:.15s}
.tip:active{transform:scale(.98)}
.tip .e{font-size:16px;flex:none;width:24px;text-align:center}
.tip .tx{font-size:11px;color:var(--txt2);line-height:1.4;min-width:0}
.tip .tx b{color:var(--txt);font-weight:700;display:block;font-size:12px;margin-bottom:1px}
.tip.done{border-color:#3a4a2c;background:rgba(200,242,78,.06)}
.tip.done .tx b{color:var(--lime)}
.tip .ck{margin-left:auto;flex:none;width:21px;height:21px;border-radius:7px;border:1.5px solid #3a3358;display:grid;place-items:center;font-size:11px;color:transparent}
.tip.done .ck{background:var(--lime);border-color:var(--lime);color:#0a0c07}
.weekrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;position:relative}
.ws{border-radius:12px;padding:10px 6px;text-align:center;background:rgba(255,255,255,.03);border:1px solid #2b2542;transition:.15s}
.ws:active{transform:scale(.96)}
.ws .d{font-size:8.5px;font-weight:800;letter-spacing:.5px;color:var(--txt4);text-transform:uppercase}
.ws .v{font-size:15px;font-weight:800;font-family:var(--mono);margin-top:3px;color:var(--txt3)}
.ws .s{font-size:9px;margin-top:2px;color:var(--txt4)}
.ws.ok{border-color:#3a4a2c;background:rgba(200,242,78,.07)}
.ws.ok .v{color:var(--lime)}.ws.ok .s{color:var(--lime-d)}
.ws.now{border-color:var(--violet);background:rgba(167,139,250,.1)}
.ws.now .v{color:var(--violet)}
.next{position:relative;background:linear-gradient(135deg,#1e2617,#141a19);border:1px solid #35422a;border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:11px;text-align:left;width:100%;transition:.15s}
.next:active{transform:scale(.98);border-color:var(--lime-d)}
.next .cal-i{width:36px;height:36px;flex:none;border-radius:11px;background:#0f1310;border:1px solid #303c26;display:grid;place-items:center;font-family:var(--mono);font-size:13px;font-weight:800;color:var(--lime)}
.next .nx{flex:1;min-width:0}
.next .nx .a{font-size:8.5px;color:var(--txt4);text-transform:uppercase;letter-spacing:.8px;font-weight:800}
.next .nx .b{font-size:12.5px;font-weight:700;margin-top:2px}
.next .ar{stroke:var(--lime);width:15px;height:15px;fill:none;stroke-width:2.4;flex:none}

/* ═══ ДОК: в обычном потоке (не fixed) → контент всегда доходит до низа ═══ */
.dock{flex:none;background:#0b0e10;border-top:1px solid var(--line);position:relative;z-index:6;padding:9px 12px calc(9px + env(safe-area-inset-bottom))}
.dock-prog{position:absolute;top:-1px;left:0;right:0;height:3px;background:#15191c}
.dock-prog i{display:block;height:100%;background:linear-gradient(90deg,var(--lime),var(--cyan));box-shadow:0 0 11px rgba(200,242,78,.5);transition:width .35s cubic-bezier(.2,.8,.3,1)}
.dock-row{display:flex;gap:6px}
.btn{border-radius:12px;font-size:12.5px;font-weight:750;padding:13px 8px;transition:transform .12s,background .15s;display:flex;align-items:center;justify-content:center;gap:5px}
.btn:active{transform:scale(.96)}
.btn-ghost{background:var(--surf2);border:1px solid var(--line2);color:var(--txt)}
.btn-lime{background:linear-gradient(135deg,var(--lime),#a8e02f);color:#0a0c07}
.btn-danger{background:rgba(242,104,92,.12);border:1px solid rgba(242,104,92,.45);color:var(--red)}
.btn-plan{flex:1}
.btn-plan.clear{background:rgba(242,104,92,.1);border-color:rgba(242,104,92,.45);color:var(--red)}
.btn-timer{flex:0 0 90px;font-family:var(--mono);background:var(--surf2);border:1px solid var(--line2)}
.btn-timer.run{background:rgba(69,205,242,.14);border-color:var(--cyan);color:var(--cyan)}
.btn-fin{flex:0 0 110px;background:linear-gradient(135deg,var(--lime),#a8e02f);color:#0a0c07}
.btn-fin.done{background:var(--surf2);border:1px solid var(--lime-d);color:var(--lime)}
.tpop{position:absolute;bottom:calc(100% + 9px);right:12px;background:var(--overlay);border:1px solid var(--line2);border-radius:13px;padding:8px;display:none;gap:6px;box-shadow:0 14px 40px rgba(0,0,0,.65)}
.tpop.show{display:flex}
.tpop button{padding:9px 12px;border-radius:9px;background:var(--surf3);font-size:12px;font-weight:750;font-family:var(--mono);color:var(--txt2)}
.tpop button.stop{color:var(--red)}

/* ═══ ШТОРКИ + [ТЗ-1] свайп вниз ══════════════════════════════════════════
   .grab-zone и .sheet-h имеют touch-action:none — жест всегда наш.
   Из тела шторки свайп работает, когда оно прокручено в самый верх. */
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .26s}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:90dvh;display:flex;flex-direction:column;background:linear-gradient(180deg,var(--overlay),var(--bg2));border-top:1px solid var(--line2);border-radius:22px 22px 0 0;transform:translateY(102%);transition:transform .32s cubic-bezier(.2,.8,.25,1);box-shadow:0 -20px 60px rgba(0,0,0,.7);padding-bottom:env(safe-area-inset-bottom);will-change:transform}
.sheet.show{transform:none}
.sheet.dragging{transition:none}          /* во время жеста шторка идёт за пальцем */
.grab-zone{flex:none;padding:9px 0 3px;touch-action:none;cursor:grab}
.grab{width:38px;height:4px;border-radius:3px;background:#3a444c;margin:0 auto}
.sheet-h{padding:5px 16px 12px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:11px;flex:none;touch-action:none}
.sheet-h h2{font-size:16.5px;font-weight:800;letter-spacing:-.3px;line-height:1.25}
.sheet-h .s{font-size:11px;color:var(--txt3);margin-top:2px}
.x{margin-left:auto;width:30px;height:30px;flex:none;border-radius:9px;background:var(--surf3);display:grid;place-items:center;color:var(--txt2);font-size:15px;touch-action:auto}
.sheet-b{overflow-y:auto;padding:14px 16px 18px;overscroll-behavior:contain}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:14px}
.kpi{background:var(--surf);border:1px solid var(--line);border-radius:13px;padding:12px;position:relative;overflow:hidden}
.kpi::after{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--lime)}
.kpi.c::after{background:var(--cyan)}.kpi.a::after{background:var(--amber)}.kpi.v::after{background:var(--violet)}.kpi.r::after{background:var(--red)}
.kpi .k{font-size:9px;color:var(--txt4);text-transform:uppercase;letter-spacing:.8px;font-weight:800}
.kpi .v{font-size:19px;font-weight:800;font-family:var(--mono);margin-top:3px}
.kpi .d{font-size:10px;margin-top:2px;color:var(--txt3)}
.kpi .d.up{color:var(--lime)}.kpi .d.dn{color:var(--amber)}
.spark{background:var(--surf);border:1px solid var(--line);border-radius:13px;padding:13px;margin-bottom:14px}
.spark .st{font-size:9.5px;color:var(--txt4);text-transform:uppercase;letter-spacing:.8px;font-weight:800;margin-bottom:10px}
.spark svg{width:100%;height:82px;overflow:visible}
.htable{width:100%;border-collapse:collapse;font-size:11.5px}
.htable th{text-align:left;font-size:9px;color:var(--txt4);text-transform:uppercase;letter-spacing:.7px;padding:0 8px 8px 0;font-weight:800;border-bottom:1px solid var(--line)}
.htable td{padding:9px 8px 9px 0;border-bottom:1px solid #181d21;font-family:var(--mono);color:var(--txt2);vertical-align:top}
.htable td:first-child{color:var(--txt);font-weight:700;white-space:nowrap}
.htable .mx{color:var(--lime);font-weight:800}
.sheet-f{padding:11px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:8px;flex:none}
.sheet-f .btn{flex:1;padding:13px;font-size:12.5px}
.rank{display:flex;flex-direction:column;gap:8px}
.rk{display:flex;align-items:center;gap:10px}
.rk .nm{font-size:11.5px;color:var(--txt2);width:114px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk .rb{flex:1;height:7px;border-radius:4px;background:#1b2024;overflow:hidden}
.rk .rb i{display:block;height:100%;border-radius:4px}
.rk .vv{font-size:10.5px;font-family:var(--mono);color:var(--txt3);width:52px;text-align:right;flex:none}
.sect-t{font-size:9.5px;color:var(--txt4);text-transform:uppercase;letter-spacing:.9px;font-weight:800;margin:16px 0 10px}
.sect-t:first-child{margin-top:0}
.plan-ta{width:100%;min-height:140px;background:#14181b;border:1px solid var(--line2);border-radius:12px;padding:12px;font-family:var(--mono);font-size:12.5px;outline:none;resize:vertical;line-height:1.5}
.plan-ta:focus{border-color:var(--lime-d)}
.fmt{font-size:11px;color:var(--txt3);line-height:1.55;background:var(--surf);border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-bottom:11px}
.fmt code{color:var(--lime);font-family:var(--mono)}
.pv-row{display:flex;align-items:baseline;gap:8px;padding:8px 0;border-bottom:1px solid #181d21;font-size:11.5px}
.pv-row .nm{flex:1;min-width:0}
.pv-row .old{color:var(--txt4);font-family:var(--mono);text-decoration:line-through}
.pv-row .new{color:var(--lime);font-family:var(--mono);font-weight:800}
.verdict{background:linear-gradient(150deg,#1a2116,#12161a 62%);border:1px solid #35422a;border-radius:14px;padding:13px;margin-bottom:13px}
.verdict .vt{font-size:9.5px;color:var(--lime-d);text-transform:uppercase;letter-spacing:.8px;font-weight:800}
.verdict p{font-size:12px;color:var(--txt);line-height:1.55;margin-top:6px}
.an-row{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px;position:relative;overflow:hidden}
.an-row::after{content:'';position:absolute;left:0;top:0;bottom:0;width:3px}
.an-row.up::after{background:var(--lime)}.an-row.hold::after{background:var(--cyan)}.an-row.down::after{background:var(--amber)}
.an-h{display:flex;align-items:center;gap:8px}
.an-h b{flex:1;min-width:0;font-size:12.5px;font-weight:750}
.an-sets{display:flex;align-items:center;gap:7px;margin-top:7px;font-family:var(--mono);font-size:11px;flex-wrap:wrap}
.an-sets .was{color:var(--txt4)}.an-sets .arw{color:var(--txt4)}.an-sets .now{color:var(--txt)}
.an-sets .nx{margin-left:auto;color:var(--lime);font-weight:800;background:rgba(200,242,78,.1);padding:2px 7px;border-radius:6px}
.an-note{font-size:10.5px;color:var(--txt3);line-height:1.5;margin-top:6px}
.xls-list{display:flex;flex-direction:column;gap:7px}
.xls-row{display:flex;align-items:center;gap:10px;background:var(--surf);border:1px solid var(--line);border-radius:11px;padding:10px 12px}
.xls-row .ic{width:26px;height:26px;flex:none;border-radius:8px;display:grid;place-items:center;font-size:11px;font-weight:800;font-family:var(--mono);background:rgba(200,242,78,.14);color:var(--lime)}
.xls-row .nm{flex:1;min-width:0;font-size:12.5px;font-weight:700}
.xls-row .ds{font-size:10px;color:var(--txt4);font-family:var(--mono)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);transform:translate(-50%,12px);z-index:60;background:var(--overlay);border:1px solid var(--line2);border-radius:13px;padding:10px 12px 10px 15px;display:flex;align-items:center;gap:12px;font-size:12.5px;box-shadow:0 14px 40px rgba(0,0,0,.65);opacity:0;pointer-events:none;transition:.26s;max-width:calc(100vw - 28px)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast .undo{color:var(--lime);font-weight:800;font-size:12px;padding:6px 9px;border-radius:8px;background:rgba(200,242,78,.12);flex:none}
input[type=file],input[type=date].hidden{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

/* ═══ iPhone 16 Pro Max и другие tall-экраны: enlargе тач-целей и типографики ═══ */
@media (min-width:400px) and (min-height:860px){
  .hdr-main{padding:10px 14px 7px;gap:6px}
  .hnav{width:34px;height:42px;font-size:19px}
  .ib{width:34px;height:42px;font-size:15px}
  .ib.lime{width:44px;font-size:11.5px}
  .ib svg{width:17px;height:17px}
  .hdate .d{font-size:17px}.hdate .w{font-size:11px}
  .mark{width:32px;height:32px}
  .cal{padding:2px 14px 6px;gap:6px}
  .cd{width:46px;height:38px}
  .cd .num{font-size:13.5px}.cd .n{font-size:8px}
  .tabs{padding:0 14px 7px}
  .tab{height:34px;font-size:12.5px}
  .chips{padding:0 14px 9px;gap:6px}
  .chip{height:36px;font-size:12.5px;border-radius:18px}
  .scroll{padding:0 14px 16px}
  .sess-line .t{font-size:15.5px}
  .card-h{padding:14px 14px 11px}
  .card-h h3{font-size:16px}
  .sh,.set{grid-template-columns:26px 1fr 68px 68px;gap:8px;padding-left:14px;padding-right:14px}
  .set{padding-top:11px;padding-bottom:11px}
  .inp{height:44px;font-size:15.5px;border-radius:12px}
  .pl{font-size:13.5px}.pv{font-size:11.5px}.idx{font-size:14px}
  .card-f button{padding:13px 14px;font-size:13.5px}
  .note{font-size:11.5px;padding-left:44px}
  .tips{grid-template-columns:1fr 1fr;gap:10px}
  .tip{padding:13px;align-items:flex-start}
  .rest-hero p{font-size:13px;max-width:370px}
  .dock{padding:11px 14px calc(11px + env(safe-area-inset-bottom))}
  .btn{padding:15px 8px;font-size:13.5px;border-radius:14px}
  .btn-timer{flex:0 0 102px}.btn-fin{flex:0 0 124px}
  .pill{height:40px;font-size:14.5px}
  .fld input{height:44px;font-size:15px}
  .fsec{padding:15px}
}
/* узкие экраны: прячем марку, сжимаем сетку подхода */
@media (max-width:359px){
  .mark{display:none}.hdate .d{font-size:13.5px}
  .sh,.set{grid-template-columns:20px 1fr 52px 52px;gap:5px;padding-left:10px;padding-right:10px}
  .btn-timer{flex:0 0 76px}.btn-fin{flex:0 0 94px}
  .ib{width:27px}.ib.lime{width:34px}
  .chip{font-size:10.5px}
  .fgrid{grid-template-columns:repeat(2,1fr)}
  .zonegrid{grid-template-columns:repeat(3,1fr)}
}
/* планшет/десктоп: центрируем колонку 720px */
@media (min-width:760px){
  .hdr-main,.cal,.tabs,.chips,.scroll,.dock{padding-left:max(14px,calc((100vw - 720px)/2));padding-right:max(14px,calc((100vw - 720px)/2))}
}
</style>
</head>
<!-- body.tab-feel скрывает овалы дней, когда открыта вкладка самочувствия -->
<body class="tab-work">

<!-- ═══ ШАПКА: марка-гантель, стрелки дней, дата, звук, wake-lock, Excel ═══ -->
<header class="hdr">
  <div class="hdr-main">
    <!-- этот же путь гантели рисуется в PNG для иконки рабочего стола -->
    <div class="mark"><svg viewBox="0 0 24 24"><path d="M5 9v6M19 9v6M8 7v10M16 7v10M8 12h8"/></svg></div>
    <button class="hnav" id="prevDay" aria-label="Предыдущий день">‹</button>
    <button class="hdate" id="dateBtn"><span class="d mono" id="dateText">—</span><span class="w" id="dateSub">—</span></button>
    <button class="hnav" id="nextDay" aria-label="Следующий день">›</button>
    <div class="hact">

/* ── утилиты дат/чисел. Даты — строки 'YYYY-MM-DD', полдень для защиты от DST ── */
const pad=n=>String(n).padStart(2,'0');
const dk=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pk=k=>{const[a,b,c]=k.split('-').map(Number);return new Date(a,b-1,c,12)};
const fd=k=>{const d=pk(k);return `${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()}`};
const fs=k=>{const d=pk(k);return `${pad(d.getDate())}.${pad(d.getMonth()+1)}`};
const today=()=>dk(new Date());
const addD=(k,n)=>{const d=pk(k);d.setDate(d.getDate()+n);return dk(d)};
const mondayOf=k=>{const d=pk(k);d.setDate(d.getDate()-((d.getDay()+6)%7));return dk(d)};
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?null:n};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function load(){try{const r=localStorage.getItem(KEY);if(r)S={...S,...JSON.parse(r)}}catch(e){}}

function seed(){
 Object.keys(SEED).forEach(k=>{if(S.log[k])return;const s=SEED[k],sets={};s.ex.forEach((a,ei)=>a.forEach((wr,si)=>{sets[ei+'_'+si]={w:wr[0],r:wr[1]}}));S.log[k]={day:s.day,sets,done:true,dur:s.dur,ts:pk(k).getTime()}});
 SEED_WEIGHTS.forEach(([k,v])=>{if(S.weights[k]==null)S.weights[k]=v});
 Object.keys(WATCH_SEED).forEach(k=>{if(!S.watch[k])S.watch[k]=JSON.parse(JSON.stringify(WATCH_SEED[k]))});
 Object.keys(FEEL_SEED).forEach(k=>{if(!S.feel[k])S.feel[k]={...FEEL_SEED[k]}});

/* Какая тренировка стоит на дату: ручное назначение → факт → автоподбор Пн/Ср/Пт */
function resolve(k){if(S.override[k]!==undefined)return{day:S.override[k],src:'manual'};if(S.log[k]&&hasData(S.log[k]))return{day:S.log[k].day,src:'logged'};return{day:DOW_DAY[pk(k).getDay()]||0,src:'auto'}}
function hasData(r){return r&&r.sets&&Object.values(r.sets).some(s=>s&&(s.w!==''&&s.w!=null||s.r!==''&&s.r!=null))}
function prevDate(day,before){return Object.keys(S.log).filter(k=>k<before&&S.log[k].day===day&&hasData(S.log[k])).sort().pop()||null}
/* [ТЗ-3] upperRep — верхняя граница диапазона. Именно она уходит в поле «повт» */
function upperRep(v){if(typeof v==='number')return v;const m=String(v).split('–').map(x=>parseInt(x));return m[m.length-1]||m[0]}
function planVals(s){return{w:s.planW==='свой вес'?'':s.planW,r:upperRep(s.planR)}}
function range(s){const m=String(s.planR).split('–').map(x=>parseInt(x));return{lo:m[0],hi:m[m.length-1]||m[0]}}
/* Объём считаем только по рабочим подходам: вес × повторы */
function volOf(k){const r=S.log[k];if(!r)return 0;let v=0;(S.plan[r.day]||[]).forEach((e,ei)=>e.sets.forEach((s,si)=>{if(s.type!=='рабочий')return;const x=r.sets[ei+'_'+si];if(x&&num(x.w)!=null&&num(x.r)!=null)v+=num(x.w)*num(x.r)}));return Math.round(v)}
function countSets(k){const r=S.log[k],res=resolve(k);if(!res.day)return{done:0,total:0};let t=0,d=0;S.plan[res.day].forEach((e,ei)=>e.sets.forEach((s,si)=>{t++;const x=r&&r.sets[ei+'_'+si];if(x&&num(x.w)!=null&&num(x.r)!=null)d++}));return{done:d,total:t}}

function beep(kind){if(!S.sound)return;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const t=audioCtx.currentTime;
 /* end = восходящее трио 880→1174→1568 Гц, ok = короткий двойной клик */
 const seq=kind==='end'?[[880,0,.14],[1174,.18,.18],[1568,.4,.26]]:[[659,0,.09],[988,.11,.14]];
 seq.forEach(([f,o,d])=>{const os=audioCtx.createOscillator(),g=audioCtx.createGain();os.type='sine';os.frequency.value=f;g.gain.setValueAtTime(0,t+o);g.gain.linearRampToValueAtTime(.26,t+o+.02);g.gain.exponentialRampToValueAtTime(.001,t+o+d);os.connect(g);g.connect(audioCtx.destination);os.start(t+o);os.stop(t+o+d+.05)})}catch(e){}}
function buzz(p){if(S.sound&&navigator.vibrate)try{navigator.vibrate(p)}catch(e){}}
/* Разрешение спрашиваем один раз и только по жесту (старт таймера / включение звука) */
function askNotif(){if(notifAsked||!('Notification'in window))return;notifAsked=true;try{if(Notification.permission==='default')Notification.requestPermission()}catch(e){}}

 if(!('wakeLock'in navigator)){$('btnWake').classList.add('off');return}
 try{wakeLock=await navigator.wakeLock.request('screen');wakeOn=true;$('btnWake').classList.remove('off');$('btnWake').classList.add('on');
  wakeLock.addEventListener('release',()=>{wakeOn=false;$('btnWake').classList.remove('on');$('btnWake').classList.add('off')});
 }catch(e){wakeOn=false;$('btnWake').classList.remove('on');$('btnWake').classList.add('off')}
}

/* ══════════════════════════════════════════════════════════════════════════
   6. [ТЗ-10] ИКОНКА РАБОЧЕГО СТОЛА. Рисуем ту же гантель, что в шапке,
   на canvas и отдаём PNG data-URI: iOS не принимает SVG для apple-touch-icon.
   Манифест собираем здесь же и подключаем Blob-URL (fallback — data-URI).
   ══════════════════════════════════════════════════════════════════════════ */
function makeIcon(size){
 const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d');
 const g=x.createLinearGradient(0,0,size,size);g.addColorStop(0,'#141a12');g.addColorStop(1,'#080a0b');
 x.fillStyle=g;x.fillRect(0,0,size,size);                       // фон на весь квадрат — iOS сам скруглит
 const rg=x.createRadialGradient(size*.3,size*.22,0,size*.3,size*.22,size*.75);
 rg.addColorStop(0,'rgba(200,242,78,.20)');rg.addColorStop(1,'rgba(200,242,78,0)');
 x.fillStyle=rg;x.fillRect(0,0,size,size);
 const s=size/24;x.save();x.scale(s,s);                          // та же система координат 24×24, что у SVG
 x.strokeStyle='#c8f24e';x.lineWidth=2.3;x.lineCap='round';
 x.beginPath();[[5,9,5,15],[19,9,19,15],[8,7,8,17],[16,7,16,17],[8,12,16,12]].forEach(([a,b,c2,d])=>{x.moveTo(a,b);x.lineTo(c2,d)});x.stroke();
 x.restore();return c.toDataURL('image/png');
}
function setIcons(){
 try{
  const i180=makeIcon(180),i512=makeIcon(512);
  $('touchIcon').setAttribute('href',i180);
  const mf={name:'Дневник тренировок',short_name:'Дневник',start_url:'.',scope:'.',display:'standalone',orientation:'portrait',background_color:'#07080a',theme_color:'#0b0e10',
   icons:[{src:i180,sizes:'180x180',type:'image/png',purpose:'any'},{src:i512,sizes:'512x512',type:'image/png',purpose:'any maskable'}]};
  const json=JSON.stringify(mf);
  let href;try{href=URL.createObjectURL(new Blob([json],{type:'application/json'}))}catch(_){href='data:application/json;charset=utf-8,'+encodeURIComponent(json)}
  $('manifestLink').setAttribute('href',href);
 }catch(e){}
}

/* ══════════════════════════════════════════════════════════════════════════
   7. ДЕЙСТВИЯ. Каждое разрушающее действие делает снимок для undo.
   ══════════════════════════════════════════════════════════════════════════ */
function go(k){S.date=k;save();renderAll(true);$('scroll').scrollTop=0}

/* Ручное назначение дня за датой. Если на дату уже был другой день с фактом —
   запись очищается, но действие можно отменить через тост. */
function assign(day){
 const k=S.date,cur=resolve(k),old=S.log[k];if(cur.day===day&&S.override[k]===undefined)return;
 const s=snap();let ch=false;
 if(old&&old.day!==day&&hasData(old)){delete S.log[k];ch=true}
 if(day===0)S.override[k]=0;
 else{const auto=DOW_DAY[pk(k).getDay()]||0;if(auto===day)delete S.override[k];else S.override[k]=day;
  if(!S.log[k])S.log[k]={day,sets:{},done:false,ts:Date.now()};else S.log[k].day=day}
 pushUndo(s);save();renderAll(true);toast(ch?'День изменён, запись очищена':(day===0?'Отмечен день отдыха':'Назначен '+DAY_NAMES[day]),ch);
}
function resetAuto(){const s=snap();delete S.override[S.date];pushUndo(s);save();renderAll(true);toast('Вернул автоподбор по дню недели',true)}
function ensureLog(){const k=S.date,res=resolve(k);if(!res.day)return null;if(!S.log[k])S.log[k]={day:res.day,sets:{},done:false,ts:Date.now()};S.log[k].day=res.day;if(!S.log[k].start)S.log[k].start=Date.now();return S.log[k]}
function setCell(ei,si,f,val){const r=ensureLog();if(!r)return;const key=ei+'_'+si;if(!r.sets[key])r.sets[key]={w:'',r:''};const n=val===''?'':num(val);r.sets[key][f]=n==null?'':n;save()}
/* «Заполнено планом» = вес совпал и повторы равны ВЕРХНЕЙ границе */
function exFilled(ei){const k=S.date,r=S.log[k],res=resolve(k);if(!r||!res.day)return false;
 return S.plan[res.day][ei].sets.every((s,si)=>{const x=r.sets[ei+'_'+si];if(!x)return false;const p=planVals(s);
  const wOk=p.w===''?(x.w!==''&&x.w!=null):num(x.w)===p.w;return wOk&&num(x.r)===p.r})}
function dayFilled(){const res=resolve(S.date);if(!res.day)return false;return S.plan[res.day].every((_,i)=>exFilled(i))}
function bodyWeight(){const k=Object.keys(S.weights).sort().pop();return k?S.weights[k]:''}
/* [ТЗ-3] Заполнение: вес из плана + верхняя граница повторений.
   Для «свой вес» берём вес прошлого занятия, иначе последний утренний вес. */
function fillEx(ei){
 const k=S.date,res=resolve(k),r=ensureLog();if(!r)return;
 const pd=prevDate(res.day,k);
 S.plan[res.day][ei].sets.forEach((s,si)=>{const p=planVals(s);let w=p.w;
  if(w===''){const prev=pd?S.log[pd].sets[ei+'_'+si]:null;w=(prev&&num(prev.w)!=null)?num(prev.w):bodyWeight()}
  r.sets[ei+'_'+si]={w,r:p.r}});
}
function clearEx(ei){const r=S.log[S.date];if(!r)return;S.plan[resolve(S.date).day][ei].sets.forEach((_,si)=>{r.sets[ei+'_'+si]={w:'',r:''}})}

/* ── [ТЗ-7] ТОЧЕЧНАЯ ПЕРЕКРАСКА DOM ────────────────────────────────────────
   Никакого innerHTML при заполнении плана: обновляем только value и классы
   существующих узлов. Фокус не теряется, рамка не мигает, скролл не прыгает. */
function paintEx(ei){
 const card=document.querySelector(`[data-card="${ei}"]`);if(!card)return;
 card.querySelectorAll('.set').forEach(row=>{const si=+row.dataset.si;paintSet(ei,si,row)});
 const btn=card.querySelector('[data-plan]'),f=exFilled(ei);
 btn.textContent=f?'✕ Убрать план':'Вес как в плане';btn.classList.toggle('clear',f);
}
function paintSet(ei,si,row){
 const k=S.date,r=S.log[k],res=resolve(k),set=S.plan[res.day][ei].sets[si];
 const x=(r&&r.sets[ei+'_'+si])||{w:'',r:''};
 const iw=row.querySelector('[data-f="w"]'),ir=row.querySelector('[data-f="r"]');
 if(document.activeElement!==iw)iw.value=x.w===''?'':x.w;   // не трогаем поле под курсором
 if(document.activeElement!==ir)ir.value=x.r===''?'':x.r;
 const hw=num(x.w)!=null,hr=num(x.r)!=null,done=hw&&hr;
 iw.classList.toggle('has',hw);ir.classList.toggle('has',hr);
 row.classList.toggle('done',done);row.classList.remove('hit','miss');
 if(done){const rg=range(set),rr=num(x.r);if(rr>=rg.hi)row.classList.add('hit');else if(rr<rg.lo)row.classList.add('miss')}
 const pv=row.querySelector('.pv'),pd=prevDate(res.day,k);
 if(pv&&pd){const p=S.log[pd].sets[ei+'_'+si];
  if(p&&num(p.w)!=null){let dl='';if(hw){const df=num(x.w)-num(p.w);if(df>0)dl=`<span class="delta up">+${+df.toFixed(1)}</span>`;else if(df<0)dl=`<span class="delta dn">${+df.toFixed(1)}</span>`}
   pv.innerHTML=`${fs(pd)}: ${p.w} × ${p.r}${dl}`}}
}
function paintMeters(){
 const c=countSets(S.date);$('progBar').style.width=(c.total?c.done/c.total*100:0)+'%';
 const sc=$('sessCount');if(sc)sc.textContent=c.done+'/'+c.total;
 const v=volOf(S.date),sv=$('sessVol');if(sv)sv.textContent=v?nf(v)+' кг':'';

 if(res.day){const f=dayFilled();bp.textContent=f?'✕ Убрать план':'⚡ Вес как в плане';bp.className='btn btn-ghost btn-plan'+(f?' clear':'')}
}

function toggleEx(ei){const s=snap(),f=exFilled(ei);f?clearEx(ei):fillEx(ei);pushUndo(s);save();paintEx(ei);paintMeters();buzz(12);toast(f?'План убран':'Заполнено по максимуму плана',f)}
function toggleDay(){const res=resolve(S.date);if(!res.day)return;const s=snap(),f=dayFilled();
 S.plan[res.day].forEach((_,i)=>{f?clearEx(i):fillEx(i);paintEx(i)});pushUndo(s);save();paintMeters();buzz(18);
 toast(f?'План убран со всей тренировки':'Все подходы по максимуму плана',f)}
function deleteSession(){const k=S.date;if(!S.log[k])return;const s=snap();delete S.log[k];pushUndo(s);save();closeSheet();renderAll(true);toast('Тренировка удалена',true)}
/* Перетаскивание меняет порядок упражнений. Ключи факта 'exIdx_setIdx'
   пересчитываются через карту старый→новый индекс во ВСЕХ записях этого дня. */
function reorder(from,to){
 const res=resolve(S.date);if(!res.day||from===to)return;const d=res.day,arr=S.plan[d],s=snap(),old=JSON.parse(s).plan[d];
 const item=arr.splice(from,1)[0];arr.splice(to>from?to-1:to,0,item);
 const map={};old.forEach((e,oi)=>{map[oi]=arr.indexOf(e)});
 Object.keys(S.log).forEach(k=>{const r=S.log[k];if(r.day!==d||!r.sets)return;const ns={};
  Object.keys(r.sets).forEach(key=>{const[ei,si]=key.split('_').map(Number);const ni=map[ei];if(ni!=null&&ni>=0)ns[ni+'_'+si]=r.sets[key]});r.sets=ns});
 pushUndo(s);save();renderAll(false);toast('Порядок упражнений изменён',true);
}
function finish(){const k=S.date,r=S.log[k];if(!r||!hasData(r)){toast('Сначала заполни хотя бы один подход');return}
 if(!r.done){r.done=true;if(!r.dur)r.dur=r.start?Math.max(1,Math.round((Date.now()-r.start)/60000)):75;r.fin=Date.now();save();renderAll(false);beep('ok');buzz([20,60,20])}
 openSummary()}
/* «Применить план» из разбора: пишем рекомендованные веса в рабочие подходы */
function applyNext(){const a=ANALYSIS[S.date];if(!a)return;const s=snap();let n=0;
 a.items.forEach(it=>{if(!it.next)return;const ei=S.plan[a.day].findIndex(e=>e.name===it.n||jn(e)===it.n);if(ei<0)return;
  const ws=S.plan[a.day][ei].sets.map((x,i)=>x.type==='рабочий'?i:-1).filter(i=>i>=0);
  it.next.forEach((w,j)=>{const si=ws[j];if(si==null)return;S.plan[a.day][ei].sets[si].planW=w;if(it.nr&&it.nr[j])S.plan[a.day][ei].sets[si].planR=it.nr[j];n++})});
 S.planDate=today();pushUndo(s);save();closeSheet();renderAll(false);toast('План обновлён · '+n+' подходов',true)}

function renderAll(animate){renderHeader();renderBody(animate);renderDock()}
function renderHeader(){

 c+=`<button class="chip rest ${res.day===0?'on rest':''}" data-day="0"><span class="cn">☾</span><span>Отдых</span></button>`;

function trendOf(ei){const a=ANALYSIS[S.date];if(!a)return null;const e=S.plan[resolve(S.date).day][ei];const it=a.items.find(i=>i.n===e.name||i.n===jn(e));return it?it.s:null}
function renderBody(animate){

 if(!res.day){c.innerHTML=restHTML();return}

 ex.forEach((e,i)=>{
  const work=e.sets.filter(s=>s.type==='рабочий').length,filled=exFilled(i),tr=trendOf(i);
  h+=`<div class="card" data-card="${i}" style="--i:${i}"><div class="card-h">

 });
 h+=`<div class="endcap">— ${ex.length} упражнений · ${DAY_FULL[res.day]} —</div>`;

 </div>

/* ══════════════════════════════════════════════════════════════════════════
   9. ПЕРЕТАСКИВАНИЕ УПРАЖНЕНИЙ. Pointer events (работают и мышью, и пальцем).
   Карточка едет за пальцем, лайм-линия показывает место вставки,
   у краёв включается автопрокрутка. DOM перестраивается только на отпускании.
   ══════════════════════════════════════════════════════════════════════════ */
function startDrag(e,ei){
 const card=document.querySelector(`[data-card="${ei}"]`);if(!card)return;e.preventDefault();
 const sc=$('scroll');drag={ei,card,startY:e.clientY,target:ei,cards:[...document.querySelectorAll('.card')]};
 card.classList.add('dragging');buzz(10);
 const move=ev=>{if(!drag)return;drag.card.style.transform=`translateY(${ev.clientY-drag.startY}px) scale(1.02)`;
  const sr=sc.getBoundingClientRect();if(ev.clientY<sr.top+70)sc.scrollTop-=10;else if(ev.clientY>sr.bottom-70)sc.scrollTop+=10;
  let t=drag.cards.length;drag.cards.forEach((c,i)=>{c.classList.remove('drop-before','drop-after');if(c===drag.card)return;
   const r=c.getBoundingClientRect();if(ev.clientY<r.top+r.height/2&&t===drag.cards.length)t=i});
  drag.target=t;if(t<drag.cards.length&&drag.cards[t]!==drag.card)drag.cards[t].classList.add('drop-before');
  else if(t===drag.cards.length){const l=drag.cards[drag.cards.length-1];if(l!==drag.card)l.classList.add('drop-after')}};
 const up=()=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up);
  if(!drag)return;const from=drag.ei,to=drag.target;
  drag.cards.forEach(c=>{c.classList.remove('drop-before','drop-after','dragging');c.style.transform=''});drag=null;
  if(to!==from&&to!==from+1)reorder(from,to);else renderBody(false)};
 window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
}

/* ══════════════════════════════════════════════════════════════════════════
   10. ШТОРКИ + [ТЗ-1] СВАЙП ВНИЗ.
   Жест начинается с grab-zone / заголовка (touch-action:none) или из тела,
   когда оно прокручено в самый верх. Порог закрытия — 96 px, иначе возврат.
   Во время жеста затемнение ослабляется пропорционально сдвигу.
   ══════════════════════════════════════════════════════════════════════════ */
const scrim=$('scrim'),sheet=$('sheet');
function closeSheet(){scrim.classList.remove('show');sheet.classList.remove('show');sheet.style.transform='';sheet.classList.remove('dragging');scrim.style.opacity='';$('sheetBody').style.touchAction=''}
function openSheet(t,s,b,f){$('sheetTitle').textContent=t;$('sheetSub').textContent=s;$('sheetBody').innerHTML=b;$('sheetFoot').innerHTML=f||'';
 scrim.classList.add('show');sheet.classList.add('show');sheet.style.transform='';$('sheetBody').scrollTop=0}
(function sheetSwipe(){
 let sy=0,dy=0,active=false,fromBody=false;
 const begin=e=>{
  if(!sheet.classList.contains('show'))return;
  const t=e.target;
  if(t.closest('input,textarea,button,.x'))return;      // не мешаем вводу и кнопкам
  const body=t.closest('.sheet-b');
  fromBody=!!body;
  if(fromBody&&body.scrollTop>0)return;                 // внутри есть скролл — не наш жест
  active=true;sy=e.clientY;dy=0;sheet.classList.add('dragging');
  if(fromBody)$('sheetBody').style.touchAction='none';  // гасим нативный скролл на время жеста
 };
 const move=e=>{
  if(!active)return;
  dy=e.clientY-sy;
  if(fromBody&&$('sheetBody').scrollTop>0){active=false;sheet.classList.remove('dragging');sheet.style.transform='';$('sheetBody').style.touchAction='';return}
  if(dy<0)dy=0;                                        // вверх не тянем
  sheet.style.transform=`translateY(${dy}px)`;
  scrim.style.opacity=String(Math.max(0,1-dy/380));
  if(e.cancelable&&dy>4)e.preventDefault();
 };
 const end=()=>{
  if(!active)return;active=false;
  sheet.classList.remove('dragging');scrim.style.opacity='';$('sheetBody').style.touchAction='';
  if(dy>96){closeSheet();buzz(8)}else sheet.style.transform='';
 };
 ['grabZone','sheetHead','sheetBody'].forEach(id=>{$(id).addEventListener('pointerdown',begin)});
 window.addEventListener('pointermove',move,{passive:false});
 window.addEventListener('pointerup',end);window.addEventListener('pointercancel',end);
})();

/* ── Ручной ввод плана текстом: «День 3 / Упражнение | 40/40 | 8–12/8–10».

function norm(s){return String(s).toLowerCase().replace(/ё/g,'е').replace(/[^a-zа-я0-9]/g,'')}
function parsePlan(text){
 const changes=[],errors=[];let day=null;
 text.split(/\r?\n/).forEach(raw=>{const line=raw.trim();if(!line||line.startsWith('#'))return;
  const dm=line.match(/^день\s*([123])\s*:?$/i);if(dm){day=+dm[1];return}
  const parts=line.split('|').map(s=>s.trim());if(parts.length<2){errors.push(line);return}
  let d=day;const pd=parts[0].match(/^день\s*([123])$/i);if(pd){d=+pd[1];parts.shift()}
  if(!d){errors.push(line);return}
  const name=parts[0],weights=parts[1].split('/').map(s=>s.trim()),reps=parts[2]?parts[2].split('/').map(s=>s.trim()):null;
  const ex=S.plan[d].find(e=>norm(e.name)===norm(name)||norm(jn(e))===norm(name))||S.plan[d].find(e=>norm(e.name).includes(norm(name))||norm(name).includes(norm(e.name)));
  if(!ex){errors.push(line);return}
  const ws=ex.sets.map((s,i)=>s.type==='рабочий'?i:-1).filter(i=>i>=0);
  if(weights.length!==ws.length){errors.push(line);return}
  let bad=false;
  ws.forEach((si,j)=>{const w=weights[j]==='свой вес'?'свой вес':num(weights[j]);if(w===null){bad=true;return}
   const ch={day:d,ei:S.plan[d].indexOf(ex),si,oldW:ex.sets[si].planW,oldR:ex.sets[si].planR,newW:w,newR:reps&&reps[j]?reps[j]:ex.sets[si].planR,name:ex.name,setNo:si+1};
   if(ch.oldW!==ch.newW||String(ch.oldR)!==String(ch.newR))changes.push(ch)});
  if(bad)errors.push(line)});
 return{changes,errors};
}

    if(nr>=0&&r[nr]!==undefined&&r[nr]!=='')S.plan[d][ei].sets[si].planR=r[nr];
    Object.keys(dc).forEach(ds=>{const w=r[dc[ds].w],rp=r[dc[ds].r];if(w===undefined||w==='')return;
     const[dd,mm]=ds.split('.').map(Number);let yy=new Date().getFullYear();
     if(`${yy}-${pad(mm)}-${pad(dd)}`>addD(today(),60))yy--;      // в файле год не пишется
     const k=`${yy}-${pad(mm)}-${pad(dd)}`;
     if(!S.log[k])S.log[k]={day:d,sets:{},done:true,ts:pk(k).getTime()};
     S.log[k].day=d;S.log[k].sets[ei+'_'+si]={w:num(w)==null?'':num(w),r:num(rp)==null?'':num(rp)};cnt++})})});
  const cw=wb.Sheets['Календарь'];
  if(cw){const j=XLSX.utils.sheet_to_json(cw,{header:1}),hi=j.findIndex(r=>r&&r[0]==='Дата');
   if(hi>=0)j.slice(hi+1).forEach(r=>{if(!r||typeof r[0]!=='string'||!/^\d{2}\.\d{2}\.\d{4}$/.test(r[0]))return;
    const[a,b,c]=r[0].split('.'),k=`${c}-${b}-${a}`;
    if(r[3]==='вручную'){const m=String(r[2]).match(/День (\d)/);S.override[k]=m?+m[1]:0}
    if(num(r[7])!=null){S.watch[k]={...(S.watch[k]||{}),dur:num(r[7])};if(S.log[k])S.log[k].dur=num(r[7])}})}
  const hw=wb.Sheets['Часы'];
  if(hw){const j=XLSX.utils.sheet_to_json(hw,{header:1}),hi=j.findIndex(r=>r&&r[0]==='Дата');
   if(hi>=0)j.slice(hi+1).forEach(r=>{if(!r||typeof r[0]!=='string'||!/^\d{2}\.\d{2}\.\d{4}$/.test(r[0]))return;
    const[a,b,c]=r[0].split('.'),k=`${c}-${b}-${a}`;if(num(r[3])==null&&num(r[4])==null)return;
    const z={};[['extreme',9],['anaerobic',10],['aerobic',11],['fat',12],['warm',13]].forEach(([id,i])=>{if(num(r[i])!=null)z[id]=num(r[i])});
    const nw2={kcal:num(r[3]),dur:num(r[4]),avg:num(r[5]),max:num(r[6]),stress:num(r[7]),rec:num(r[8]),clock:r[14]||'',device:r[15]||'HUAWEI WATCH 4 Pro',kind:r[2]||'Силовые'};
    Object.keys(nw2).forEach(x=>{if(nw2[x]==null)delete nw2[x]});
    if(Object.keys(z).length)nw2.zones=z;
    S.watch[k]={...(S.watch[k]||{}),...nw2};
    if(nw2.dur!=null&&S.log[k])S.log[k].dur=nw2.dur})}
  const fw=wb.Sheets['Самочувствие'];
  if(fw){const j=XLSX.utils.sheet_to_json(fw,{header:1}),hi=j.findIndex(r=>r&&r[0]==='Дата');
   if(hi>=0)j.slice(hi+1).forEach(r=>{if(!r||typeof r[0]!=='string'||!/^\d{2}\.\d{2}\.\d{4}$/.test(r[0]))return;
    const[a,b,c]=r[0].split('.'),k=`${c}-${b}-${a}`;const f={...(S.feel[k]||{})};
    if(num(r[2])!=null)f.sleep=num(r[2]);if(num(r[3])!=null)f.fatigue=num(r[3]);if(num(r[4])!=null)f.joints=num(r[4]);
    if(r[6])f.note=String(r[6]);
    if(Object.keys(f).length)S.feel[k]=f;
    if(num(r[5])!=null){S.watch[k]={...(S.watch[k]||{}),dur:num(r[5])};if(S.log[k])S.log[k].dur=num(r[5])}})}
  const ww=wb.Sheets['Недели'];
  if(ww)XLSX.utils.sheet_to_json(ww,{header:1}).forEach(r=>{
   [8,10].forEach(ci=>{if(r&&typeof r[ci]==='string'&&/^\d{2}\.\d{2}\.\d{4}$/.test(r[ci])&&num(r[ci+1])!=null){
    const[a,b,c]=r[ci].split('.');S.weights[`${c}-${b}-${a}`]=num(r[ci+1])}})});
  pushUndo(s);S.planDate=today();save();renderAll(true);toast('Excel загружен · '+cnt+' подходов',true);
 }catch(e){toast('Не удалось прочитать файл: '+e.message)}};
 fr.readAsArrayBuffer(file);
}

/* ══════════════════════════════════════════════════════════════════════════
   14. СОБЫТИЯ. Внутри скролла — делегирование по data-атрибутам,
   поэтому перерисовка контента не требует перенавешивания обработчиков.
   ══════════════════════════════════════════════════════════════════════════ */
$('prevDay').onclick=()=>go(addD(S.date,-1));
$('nextDay').onclick=()=>go(addD(S.date,1));
/* тап по дате → нативный date-picker; тап по слову «сегодня» → прыжок на сегодня */
$('dateBtn').onclick=e=>{if(e.target.id==='todayJump'){go(today());return}
 const p=$('datePick');p.value=S.date;try{p.showPicker?p.showPicker():p.click()}catch(_){p.click()}};
$('datePick').onchange=e=>{if(e.target.value)go(e.target.value)};
$('btnCollapse').onclick=()=>{S.collapsed=!S.collapsed;save();renderHeader()};
$('btnSound').onclick=()=>{S.sound=!S.sound;save();renderHeader();if(S.sound){askNotif();beep('ok');buzz(20)}toast(S.sound?'Звук, вибрация и уведомления включены':'Звук, вибрация и уведомления выключены')};
$('btnWake').onclick=async()=>{
 if(!('wakeLock'in navigator)){toast('Браузер не поддерживает удержание экрана');return}
 if(wakeOn){relWake();S.wake=false;save();toast('Экран может гаснуть')}
 else{S.wake=true;save();await reqWake();toast(wakeOn?'Экран не гаснет, пока приложение открыто':'Не удалось удержать экран')}
};
$('calStrip').onclick=e=>{const b=e.target.closest('[data-go]');if(b)go(b.dataset.go)};
document.querySelector('.tabs').onclick=e=>{const b=e.target.closest('[data-tab]');if(b)setTab(b.dataset.tab)};
$('dayChips').onclick=e=>{const b=e.target.closest('[data-day]');if(b)assign(+b.dataset.day)};
$('btnPlan').onclick=toggleDay;
$('btnFinish').onclick=finish;
$('btnFeelSave').onclick=saveFeel;
$('btnFeelClear').onclick=clearFeel;
$('btnExport').onclick=exportXLSX;
/* долгое нажатие / правый клик по XLS → состав выгрузки */
$('btnExport').addEventListener('contextmenu',e=>{e.preventDefault();openExportInfo()});
let pressT=null;
$('btnExport').addEventListener('touchstart',()=>{pressT=setTimeout(()=>{pressT=null;openExportInfo()},520)},{passive:true});
$('btnExport').addEventListener('touchend',()=>{if(pressT){clearTimeout(pressT);pressT=null}},{passive:true});
$('btnImport').onclick=()=>$('fileInput').click();
$('fileInput').onchange=e=>{const f=e.target.files[0];if(f)importXLSX(f);e.target.value=''};
$('toastUndo').onclick=()=>{doUndo();$('toast').classList.remove('show')};
$('sheetX').onclick=closeSheet;scrim.onclick=closeSheet;
$('btnTimer').onclick=()=>{if(timer.id)stopT();else $('timerPop').classList.toggle('show')};
$('timerPop').onclick=e=>{const b=e.target.closest('[data-sec]');if(!b)return;const s=+b.dataset.sec;s?startT(s):stopT()};
sheet.onclick=e=>{
 if(e.target.closest('[data-close]'))return closeSheet();
 if(e.target.closest('[data-export]')){closeSheet();return exportXLSX()}
 if(e.target.closest('[data-del]'))return deleteSession();
 if(e.target.closest('[data-applynext]'))return applyNext();
 const p=e.target.closest('[data-plan]');if(p){const ei=+p.dataset.plan;closeSheet();toggleEx(ei)}
};
const scrollEl=$('scroll');
scrollEl.addEventListener('pointerdown',e=>{const g=e.target.closest('[data-grip]');if(g)startDrag(e,+g.dataset.grip)});
scrollEl.addEventListener('click',e=>{
 if(drag)return;
 const tb=e.target.closest('[data-tab]');if(tb)return setTab(tb.dataset.tab);
 const g=e.target.closest('[data-go]');if(g)return go(g.dataset.go);
 if(e.target.closest('[data-coach]'))return openCoach();
 /* шкала 1–5: повторный тап по той же оценке снимает её */
 const sc=e.target.closest('[data-scale]');
 if(sc){const id=sc.dataset.scale,v=+sc.dataset.v;const k=S.date;
  S.feel[k]=S.feel[k]||{};S.feel[k][id]=S.feel[k][id]===v?undefined:v;
  if(S.feel[k][id]===undefined)delete S.feel[k][id];
  save();const wrap=sc.closest('.pills');wrap.querySelectorAll('.pill').forEach(p=>p.classList.toggle('on',+p.dataset.v===S.feel[k][id]));
  buzz(10);renderDock();$('feelBdg').textContent=feelFilled(k)?'✓':'—';return}
 const rc=e.target.closest('[data-rest]');
 if(rc){const id=rc.dataset.rest;S.restChecks[S.date]=S.restChecks[S.date]||{};
  S.restChecks[S.date][id]=!S.restChecks[S.date][id];save();rc.classList.toggle('done',!!S.restChecks[S.date][id]);buzz(10);return}
 const h=e.target.closest('[data-hist]');if(h)return exHistory(+h.dataset.hist);
 const p=e.target.closest('[data-plan]');if(p)return toggleEx(+p.dataset.plan);
});
/* ввод: поля подхода красим точечно, поля часов/зон/заметки пишем сразу в S */
scrollEl.addEventListener('input',e=>{
 const i=e.target,k=S.date;
 if(i.classList.contains('inp')){
  setCell(+i.dataset.e,+i.dataset.s,i.dataset.f,i.value);
  const row=i.closest('.set');paintSet(+i.dataset.e,+i.dataset.s,row);
  const card=i.closest('.card'),ei=+i.dataset.e,btn=card.querySelector('[data-plan]'),f=exFilled(ei);
  btn.textContent=f?'✕ Убрать план':'Вес как в плане';btn.classList.toggle('clear',f);
  paintMeters();return}
 if(i.dataset.watch){
  const id=i.dataset.watch,v=i.value===''?null:num(i.value);
  S.watch[k]=S.watch[k]||{};if(v==null)delete S.watch[k][id];else S.watch[k][id]=v;
  /* из минут собираем строку времени 01:33:00 — как на экране часов */
  if(id==='dur'&&v!=null){const h=Math.floor(v/60),m=v%60;S.watch[k].clock=`${pad(h)}:${pad(m)}:00`;if(S.log[k])S.log[k].dur=v}
  i.classList.toggle('has',v!=null);save();renderDock();$('feelBdg').textContent=feelFilled(k)?'✓':'—';return}
 if(i.dataset.zone){
  const id=i.dataset.zone,v=i.value===''?null:num(i.value);
  S.watch[k]=S.watch[k]||{};S.watch[k].zones=S.watch[k].zones||{};
  if(v==null)delete S.watch[k].zones[id];else S.watch[k].zones[id]=v;
  if(!Object.keys(S.watch[k].zones).length)delete S.watch[k].zones;
  i.classList.toggle('has',v!=null);save();return}
 if(i.id==='feelNote'){S.feel[k]=S.feel[k]||{};S.feel[k].note=i.value;save();$('feelBdg').textContent=feelFilled(k)?'✓':'—'}
});
/* свайп по шапке листает дни. Только по .hdr-main — чтобы не конфликтовать
   с горизонтальным скроллом ленты календаря */
let tx=0,ty=0;
document.querySelector('.hdr-main').addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
document.querySelector('.hdr-main').addEventListener('touchend',e=>{
 const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
 if(Math.abs(dx)>52&&Math.abs(dx)>Math.abs(dy)*1.6)go(addD(S.date,dx<0?1:-1))},{passive:true});
/* горячие клавиши для десктопа */
document.addEventListener('keydown',e=>{
 if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
 if(e.key==='ArrowLeft')go(addD(S.date,-1));
 if(e.key==='ArrowRight')go(addD(S.date,1));
 if(e.key==='Escape')closeSheet();
 if(e.key.toLowerCase()==='e')openExportInfo();
 if(e.key.toLowerCase()==='a'&&ANALYSIS[S.date])openCoach();
 if(e.key.toLowerCase()==='p')openPlanImport();
 if(e.key.toLowerCase()==='f')setTab(S.tab==='feel'?'work':'feel');
});
/* первый жест: поднимаем AudioContext и wake-lock (иначе браузер не даст) */
document.addEventListener('pointerdown',()=>{if(S.sound&&!audioCtx){try{audioCtx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
 if(S.wake!==false&&!wakeOn)reqWake()},{once:true});
window.addEventListener('beforeunload',save);

/* ══════════════════════════════════════════════════════════════════════════
   15. СТАРТ. Иконки → загрузка состояния → дозаполнение seed →
   если даты нет, открываем последнюю тренировку из истории → рендер.
   ══════════════════════════════════════════════════════════════════════════ */
setIcons();load();seed();
if(!S.date)S.date=Object.keys(SEED).sort().pop();
if(!S.tab)S.tab='work';
save();renderAll(true);
$('btnTimer').textContent='⏱ '+fmtT(timer.preset);
if(S.wake!==false)reqWake();
</script>
</body>
</html>
