<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Дневник">
<meta name="theme-color" content="#07080a">
<title>Дневник тренировок</title>
<link rel="manifest" href='data:application/json,{"name":"Дневник тренировок","short_name":"Дневник","start_url":".","display":"standalone","orientation":"portrait","background_color":"%2307080a","theme_color":"%2307080a"}'>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='42' fill='%2307080a'/%3E%3Cg stroke='%23c8f24e' stroke-width='12' stroke-linecap='round'%3E%3Cpath d='M52 76v40M140 76v40M74 66v60M118 66v60M74 96h44'/%3E%3C/g%3E%3C/svg%3E">
<style>
:root{
  --bg:#07080a; --bg2:#0a0c0e; --surf:#101316; --surf2:#161a1e; --surf3:#1d2227; --overlay:#1b2126;
  --line:#232a30; --line2:#2f383f; --scrim:rgba(3,4,6,.78);
  --txt:#eef2f5; --txt2:#a3adb5; --txt3:#717c85; --txt4:#4d575f;
  --lime:#c8f24e; --lime-d:#9dc72f; --cyan:#45cdf2; --amber:#f2b544;
  --red:#f2685c; --violet:#a78bfa; --green:#5fd68b; --sand:#d9c9a6;
  --mono:ui-monospace,'SF Mono',SFMono-Regular,Menlo,'Roboto Mono',monospace;
  --sans:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',sans-serif;
  --r:14px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{
  height:100dvh;min-height:100vh;overflow:hidden;overscroll-behavior:none;
  font-family:var(--sans);color:var(--txt);-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top);
  background:
    radial-gradient(1100px 620px at 8% -12%,rgba(200,242,78,.075),transparent 60%),
    radial-gradient(900px 560px at 104% 2%,rgba(69,205,242,.06),transparent 58%),
    radial-gradient(1000px 700px at 50% 116%,rgba(167,139,250,.07),transparent 60%),
    var(--bg);
}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:#0a0c0e;border-left:1px solid var(--line)}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--lime-d),#2f89a6);border-radius:10px;border:2px solid #0a0c0e}
::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,var(--lime),var(--cyan))}
*{scrollbar-width:thin;scrollbar-color:var(--lime-d) #0a0c0e}
.nobar::-webkit-scrollbar{display:none}.nobar{scrollbar-width:none}
button,input,textarea{font-family:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
svg{display:block}

/* ══ HEADER — solid, never dimmed ══ */
.hdr{flex:none;background:#0b0e10;border-bottom:1px solid var(--line);position:relative;z-index:6}
.hdr::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,var(--lime),var(--cyan) 46%,var(--violet));opacity:.85}
.hdr-main{display:flex;align-items:center;gap:6px;padding:9px 12px 7px}
.mark{width:30px;height:30px;border-radius:9px;flex:none;display:grid;place-items:center;
  background:linear-gradient(145deg,#1d2418,#101413);border:1px solid #2c3524}
.mark svg{width:16px;height:16px;stroke:var(--lime);fill:none;stroke-width:2.2;stroke-linecap:round}
.hnav{width:34px;height:38px;flex:none;border-radius:11px;background:var(--surf2);border:1px solid var(--line2);
  display:grid;place-items:center;font-size:18px;color:var(--txt);transition:.14s}
.hnav:active{transform:scale(.9);background:var(--surf3);color:var(--lime);border-color:var(--lime-d)}
.hdate{flex:1;min-width:0;text-align:center;padding:2px;border-radius:11px;line-height:1.15}
.hdate:active{background:var(--surf2)}
.hdate .d{font-size:16px;font-weight:650;letter-spacing:.4px;color:var(--txt);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdate .w{font-size:10.5px;color:var(--txt2);display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap;overflow:hidden;margin-top:1px}
.src{font-weight:800;letter-spacing:.4px;text-transform:uppercase;font-size:8.5px;padding:1px 5px;border-radius:5px}
.src.auto{color:var(--cyan);background:rgba(69,205,242,.15)}
.src.manual{color:var(--amber);background:rgba(242,181,68,.16)}
.src.logged{color:var(--lime);background:rgba(200,242,78,.15)}
.today-jump{color:var(--cyan);font-weight:700;text-decoration:underline;text-underline-offset:2px}
.hact{display:flex;gap:5px;flex:none}
.hbtn{height:38px;min-width:34px;padding:0 10px;border-radius:11px;font-size:11.5px;font-weight:750;display:grid;place-items:center;transition:.14s}
.hbtn:active{transform:scale(.92)}
.hbtn.ghost{background:var(--surf2);border:1px solid var(--line2);color:var(--txt)}
.hbtn.lime{background:linear-gradient(135deg,var(--lime),#a8e02f);color:#0a0c07;box-shadow:0 3px 14px rgba(200,242,78,.22)}
.hbtn.icon{padding:0;width:34px;font-size:14px}
.hbtn.chev span{display:block;transition:transform .25s;font-size:12px;color:var(--txt2)}
body.cal-collapsed .hbtn.chev span{transform:rotate(180deg)}
.hdr-week{display:flex;align-items:stretch;gap:7px;padding:0 12px 7px}
.week{flex:1;min-width:0;display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{padding:5px 1px 4px;border-radius:10px;background:var(--surf);border:1px solid transparent;text-align:center;transition:.14s;min-width:0}
.wd:active{transform:scale(.93)}
.wd .n{font-size:8px;color:var(--txt4);text-transform:uppercase;letter-spacing:.5px;font-weight:800;line-height:1}
.wd .num{font-size:13.5px;font-weight:650;color:var(--txt2);font-family:var(--mono);line-height:1.3}
.wd .mk{height:3px;margin:3px auto 0;width:14px;border-radius:2px;background:transparent}
.wd.plan .mk{background:#2d353b}
.wd.logged .mk{background:linear-gradient(90deg,var(--lime),var(--lime-d));box-shadow:0 0 7px rgba(200,242,78,.45)}
.wd.rest .mk{background:#3b3452}
.wd.sel{background:linear-gradient(160deg,#212a19,#141a19);border-color:var(--lime-d)}
.wd.sel .num,.wd.sel .n{color:var(--lime)}
.wd.is-today .num{color:var(--cyan)}
.wd.is-today.sel .num{color:var(--lime)}
.week-meta{flex:none;width:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.badge{font-size:8.5px;font-weight:800;letter-spacing:.4px;padding:3px 6px;border-radius:6px;text-transform:uppercase}
.badge.auto{background:rgba(69,205,242,.15);color:var(--cyan)}
.badge.manual{background:rgba(242,181,68,.16);color:var(--amber)}
.badge.logged{background:rgba(200,242,78,.15);color:var(--lime)}
.reset-auto{font-size:13px;color:var(--txt2);width:26px;height:20px;border-radius:7px;display:grid;place-items:center}
.reset-auto:active{color:var(--cyan);background:rgba(69,205,242,.12)}
body.cal-collapsed .hdr-week{display:none}
.hdr-chips{display:flex;gap:6px;padding:0 12px 9px;overflow-x:auto}
.chip{flex:none;padding:8px 13px;border-radius:16px;background:var(--surf);border:1px solid var(--line);
  font-size:12.5px;font-weight:650;color:var(--txt2);transition:.14s;display:flex;align-items:center;gap:5px;white-space:nowrap}
.chip:active{transform:scale(.95)}
.chip .cn{font-weight:800;color:var(--txt)}
.chip.on{background:linear-gradient(135deg,#f3f7ee,#dfe8d5);border-color:#f3f7ee;color:#0d100b}
.chip.on .cn{color:#0d100b}
.chip.on.rest{background:linear-gradient(135deg,#cfbcff,#a78bfa);border-color:#a78bfa;color:#170f2b}
.chip.on.rest .cn{color:#170f2b}

/* ══ MAIN — fills everything between header and dock ══ */
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;position:relative;z-index:2;
  padding:0 12px 14px;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column}
.tools{display:flex;gap:6px;align-items:center;padding:9px 0 8px;position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid transparent}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:7px;background:var(--surf);border:1px solid var(--line);border-radius:11px;padding:9px 11px;transition:.15s}
.search:focus-within{border-color:var(--lime-d);background:var(--surf2)}
.search svg{width:13px;height:13px;stroke:var(--txt3);fill:none;stroke-width:2.2;flex:none}
.search input{flex:1;min-width:0;background:none;border:none;outline:none;font-size:13px;color:var(--txt)}
.search input::placeholder{color:var(--txt4)}
.tgl{flex:none;padding:9px 10px;border-radius:11px;background:var(--surf);border:1px solid var(--line);font-size:11px;font-weight:700;color:var(--txt2);transition:.15s}
.tgl:active{transform:scale(.94)}
.tgl.on{background:rgba(200,242,78,.14);border-color:var(--lime-d);color:var(--lime)}
.sess-line{display:flex;align-items:baseline;gap:8px;padding:2px 0 10px;flex-wrap:wrap}
.sess-line .t{font-size:14.5px;font-weight:750;letter-spacing:-.2px}
.sess-line .s{font-size:11.5px;color:var(--txt3);font-family:var(--mono)}
.sess-line .vol{margin-left:auto;font-size:11.5px;color:var(--lime);font-family:var(--mono);font-weight:700}
#content{flex:1;display:flex;flex-direction:column;min-height:0}
#content.list{display:block}

.card{background:linear-gradient(170deg,var(--surf) 0%,#0d1013 100%);border:1px solid var(--line);border-radius:var(--r);
  margin-bottom:10px;overflow:hidden;position:relative;
  animation:rise .4s cubic-bezier(.2,.7,.3,1) backwards;animation-delay:calc(var(--i)*30ms)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.card.dragging{opacity:.92;z-index:9;box-shadow:0 16px 40px rgba(0,0,0,.6);border-color:var(--lime-d);animation:none}
.card.drop-before::after,.card.drop-after::after{content:'';position:absolute;left:6px;right:6px;height:3px;border-radius:3px;
  background:linear-gradient(90deg,var(--lime),var(--cyan));box-shadow:0 0 10px rgba(200,242,78,.6)}
.card.drop-before::after{top:-7px}.card.drop-after::after{bottom:-7px}
.card-h{display:flex;align-items:center;gap:8px;padding:12px 12px 10px;width:100%;text-align:left}
.grip{flex:none;width:22px;height:30px;display:grid;place-items:center;color:var(--txt4);touch-action:none;border-radius:7px}
.grip:active{color:var(--lime);background:rgba(200,242,78,.08)}
.grip svg{width:12px;height:16px;fill:currentColor}
.card-h .tt{flex:1;min-width:0}
.card-h h3{font-size:15px;font-weight:750;letter-spacing:-.2px;line-height:1.25}
.card-h .m{font-size:10px;color:var(--txt4);white-space:nowrap;display:flex;align-items:center;gap:4px}
.card-h .m svg{stroke:var(--txt4);width:10px;height:10px;fill:none;stroke-width:2.4}
.selbox{flex:none;width:26px;height:26px;border-radius:8px;border:1.5px solid var(--line2);display:grid;place-items:center;font-size:13px;color:transparent;transition:.15s}
.selbox.on{background:var(--lime);border-color:var(--lime);color:#0a0c07}
.note{padding:0 12px 9px 42px;font-size:11px;color:var(--sand);line-height:1.45;opacity:.85}
.sh{display:grid;grid-template-columns:26px 1fr 62px 62px;gap:7px;padding:5px 12px;font-size:9px;color:var(--txt4);letter-spacing:.8px;text-transform:uppercase;font-weight:800}
.sh>:nth-child(3),.sh>:nth-child(4){text-align:center}
.set{display:grid;grid-template-columns:26px 1fr 62px 62px;gap:7px;padding:9px 12px;align-items:center;border-top:1px solid #191e22;position:relative;transition:background .18s}
.set:nth-of-type(even){background:rgba(255,255,255,.014)}
.set::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent;transition:.25s}
.set.hit::before{background:linear-gradient(180deg,var(--lime),var(--lime-d));box-shadow:0 0 9px rgba(200,242,78,.55)}
.set.miss::before{background:linear-gradient(180deg,var(--amber),var(--red));opacity:.8}
.set.warm{opacity:.62}
.idx{font-size:13px;color:var(--txt4);font-weight:650;font-family:var(--mono)}
.set.done .idx{color:var(--lime)}
.pinfo{min-width:0;line-height:1.42}
.pl{font-size:12.5px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px}
.pl .w{color:var(--txt3)}.pl b{color:var(--txt);font-weight:750}
.pl .tag{font-size:9.5px;color:var(--txt4);font-family:var(--sans)}
.pv{font-size:10.5px;color:var(--txt3);margin-top:1px;display:flex;align-items:center;gap:5px}
.pv .delta{font-size:9.5px;font-weight:800;padding:0 4px;border-radius:4px}
.pv .up{color:var(--lime);background:rgba(200,242,78,.12)}
.pv .dn{color:var(--amber);background:rgba(242,181,68,.12)}
.inp{width:100%;height:38px;background:#1b2024;border:1px solid #30383e;border-radius:10px;text-align:center;
  font-size:14px;font-weight:750;outline:none;font-family:var(--mono);transition:.15s;color:var(--txt);-moz-appearance:textfield}
.inp::-webkit-outer-spin-button,.inp::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.inp::placeholder{color:#48525a;font-weight:600;font-size:11px}
.inp:focus{border-color:var(--lime);background:#20281b;box-shadow:0 0 0 3px rgba(200,242,78,.1)}
.inp.has{border-color:#414d33;color:var(--lime)}
.card-f{display:flex;border-top:1px solid #191e22}
.card-f button{flex:1;padding:11px 12px;font-size:12.5px;font-weight:700;color:var(--lime);text-align:right}
.card-f button:active{background:rgba(200,242,78,.06)}
.card-f button.clear{color:var(--red)}
.card-f .mini{flex:none;text-align:left;color:var(--txt3);font-size:11.5px}
.endcap{text-align:center;font-size:10.5px;color:var(--txt4);padding:6px 0 2px;font-family:var(--mono);letter-spacing:.6px}

/* ══ REST — stretches to fill the whole screen ══ */
.rest{flex:1;display:flex;flex-direction:column;gap:clamp(10px,1.8vh,20px);
  border-radius:20px;padding:clamp(16px,2.6vh,30px) 18px;position:relative;overflow:hidden;
  background:linear-gradient(163deg,#1b1732 0%,#131420 46%,#0e1015 100%);border:1px solid #2c2647;
  animation:rise .5s cubic-bezier(.2,.7,.3,1)}
.rest::before{content:'';position:absolute;inset:-30% -20% auto;height:340px;pointer-events:none;
  background:radial-gradient(closest-side,rgba(167,139,250,.2),transparent)}
.rest-hero{text-align:center;position:relative}
.moon{width:clamp(52px,7vh,76px);height:clamp(52px,7vh,76px);margin:0 auto 12px;border-radius:20px;display:grid;place-items:center;
  background:linear-gradient(145deg,#2b2452,#1a1731);border:1px solid #3c3266;box-shadow:0 0 34px rgba(167,139,250,.22)}
.moon svg{width:46%;height:46%;stroke:var(--violet);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.rest h2{font-size:clamp(18px,2.6vh,24px);font-weight:800;letter-spacing:-.3px}
.rest-hero p{font-size:12.5px;color:var(--txt2);margin:7px auto 0;line-height:1.55;max-width:340px}
.tips{flex:1;display:grid;grid-template-columns:1fr;gap:8px;align-content:stretch;position:relative}
.tip{display:flex;align-items:center;gap:11px;background:rgba(255,255,255,.035);border:1px solid #2b2542;border-radius:13px;padding:11px 13px;text-align:left;transition:.15s}
.tip:active{transform:scale(.98)}
.tip .e{font-size:17px;flex:none;width:26px;text-align:center}
.tip .tx{font-size:11.5px;color:var(--txt2);line-height:1.4;min-width:0}
.tip .tx b{color:var(--txt);font-weight:700;display:block;font-size:12.5px;margin-bottom:1px}
.tip.done{border-color:#3a4a2c;background:rgba(200,242,78,.06)}
.tip.done .tx b{color:var(--lime)}
.tip .ck{margin-left:auto;flex:none;width:22px;height:22px;border-radius:7px;border:1.5px solid #3a3358;display:grid;place-items:center;font-size:12px;color:transparent}
.tip.done .ck{background:var(--lime);border-color:var(--lime);color:#0a0c07}
.weekrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;position:relative}
.ws{border-radius:13px;padding:10px 8px;text-align:center;background:rgba(255,255,255,.03);border:1px solid #2b2542;transition:.15s}
.ws:active{transform:scale(.96)}
.ws .d{font-size:9px;font-weight:800;letter-spacing:.6px;color:var(--txt4);text-transform:uppercase}
.ws .v{font-size:15px;font-weight:800;font-family:var(--mono);margin-top:3px;color:var(--txt3)}
.ws .s{font-size:9.5px;margin-top:2px;color:var(--txt4)}
.ws.ok{border-color:#3a4a2c;background:rgba(200,242,78,.07)}
.ws.ok .v{color:var(--lime)}.ws.ok .s{color:var(--lime-d)}
.ws.now{border-color:var(--violet);background:rgba(167,139,250,.1)}
.ws.now .v{color:var(--violet)}
.next{position:relative;background:linear-gradient(135deg,#1e2617,#141a19);border:1px solid #35422a;border-radius:15px;
  padding:13px 15px;display:flex;align-items:center;gap:12px;text-align:left;width:100%;transition:.15s}
.next:active{transform:scale(.98);border-color:var(--lime-d)}
.next .cal-i{width:38px;height:38px;flex:none;border-radius:12px;background:#0f1310;border:1px solid #303c26;display:grid;place-items:center;font-family:var(--mono);font-size:14px;font-weight:800;color:var(--lime)}
.next .nx{flex:1;min-width:0}
.next .nx .a{font-size:9px;color:var(--txt4);text-transform:uppercase;letter-spacing:.8px;font-weight:800}
.next .nx .b{font-size:13px;font-weight:700;margin-top:2px}
.next .ar{stroke:var(--lime);width:16px;height:16px;fill:none;stroke-width:2.4;flex:none}
.empty{flex:1;display:grid;place-items:center;text-align:center;padding:36px 18px;color:var(--txt3);font-size:13px}
.empty button{margin-top:12px;color:var(--lime);font-size:12.5px;font-weight:700;text-decoration:underline;text-underline-offset:3px}

/* ══ BULK + DOCK — in normal flow, bottom always reached ══ */
.bulkbar{flex:none;display:none;align-items:center;gap:7px;padding:8px 12px;background:#141a12;border-top:1px solid #35422a}
.bulkbar.show{display:flex}
.bulkbar .c{font-size:11.5px;font-weight:750;color:var(--lime);font-family:var(--mono);flex:none}
.bulkbar .btn{padding:9px 8px;font-size:11.5px}
.dock{flex:none;background:#0b0e10;border-top:1px solid var(--line);position:relative;z-index:6;
  padding:9px 12px calc(9px + env(safe-area-inset-bottom))}
.dock-prog{position:absolute;top:-1px;left:0;right:0;height:3px;background:#15191c}
.dock-prog i{display:block;height:100%;background:linear-gradient(90deg,var(--lime),var(--cyan));box-shadow:0 0 11px rgba(200,242,78,.5);transition:width .4s cubic-bezier(.2,.8,.3,1)}
.dock-row{display:flex;gap:7px}
.btn{border-radius:12px;font-size:13px;font-weight:750;padding:13px 8px;transition:transform .12s,background .15s;display:flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:scale(.96)}
.btn-ghost{background:var(--surf2);border:1px solid var(--line2);color:var(--txt)}
.btn-lime{background:linear-gradient(135deg,var(--lime),#a8e02f);color:#0a0c07}
.btn-danger{background:rgba(242,104,92,.12);border:1px solid rgba(242,104,92,.45);color:var(--red)}
.btn-plan{flex:1}
.btn-plan.clear{background:rgba(242,104,92,.1);border-color:rgba(242,104,92,.45);color:var(--red)}
.btn-timer{flex:0 0 92px;font-family:var(--mono);background:var(--surf2);border:1px solid var(--line2)}
.btn-timer.run{background:rgba(69,205,242,.14);border-color:var(--cyan);color:var(--cyan)}
.btn-fin{flex:0 0 112px;background:linear-gradient(135deg,var(--lime),#a8e02f);color:#0a0c07;box-shadow:0 4px 16px rgba(200,242,78,.2)}
.btn-fin.done{background:var(--surf2);border:1px solid var(--lime-d);color:var(--lime);box-shadow:none}

function startDrag(e,ei){
 const card=document.querySelector(`[data-card="${ei}"]`);if(!card)return;
 e.preventDefault();
 const sc=$('scroll'),rect=card.getBoundingClientRect();
 drag={ei,card,startY:e.clientY,dy:0,target:ei,cards:[...document.querySelectorAll('.card')]};
 card.classList.add('dragging');

 const move=ev=>{
  if(!drag)return;
  drag.dy=ev.clientY-drag.startY;
  drag.card.style.transform=`translateY(${drag.dy}px) scale(1.02)`;
  const sr=sc.getBoundingClientRect();
  if(ev.clientY<sr.top+70)sc.scrollTop-=10;
  else if(ev.clientY>sr.bottom-70)sc.scrollTop+=10;
  const y=ev.clientY;let t=drag.cards.length;
  drag.cards.forEach((c,i)=>{
   c.classList.remove('drop-before','drop-after');
   if(c===drag.card)return;
   const r=c.getBoundingClientRect();
   if(y<r.top+r.height/2&&t===drag.cards.length)t=i;
  });
  drag.target=t;
  if(t<drag.cards.length&&drag.cards[t]!==drag.card)drag.cards[t].classList.add('drop-before');
  else if(t===drag.cards.length){const last=drag.cards[drag.cards.length-1];if(last!==drag.card)last.classList.add('drop-after')}
 };
 const up=()=>{
  window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up);
  if(!drag)return;
  const from=drag.ei;let to=drag.target;
  drag.cards.forEach(c=>{c.classList.remove('drop-before','drop-after','dragging');c.style.transform=''});
  drag=null;
  if(to!==from&&to!==from+1)reorder(from,to);else renderBody();
 };
 window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
}

function norm(s){return String(s).toLowerCase().replace(/ё/g,'е').replace(/[^a-zа-я0-9]/g,'')}
function parsePlan(text){
 const changes=[],errors=[];let day=null;
 text.split(/\r?\n/).forEach(raw=>{
  const line=raw.trim();if(!line||line.startsWith('#'))return;
  const dm=line.match(/^день\s*([123])\s*:?$/i);if(dm){day=+dm[1];return}
  const parts=line.split('|').map(s=>s.trim());
  if(parts.length<2){errors.push(line);return}
  let d=day;const pd=parts[0].match(/^день\s*([123])$/i);if(pd){d=+pd[1];parts.shift()}
  if(!d){errors.push(line);return}
  const name=parts[0],weights=parts[1].split('/').map(s=>s.trim()),reps=parts[2]?parts[2].split('/').map(s=>s.trim()):null;
  const ex=S.plan[d].find(e=>norm(e.name)===norm(name)||norm(jn(e))===norm(name))
   ||S.plan[d].find(e=>norm(e.name).includes(norm(name))||norm(name).includes(norm(e.name)));
  if(!ex){errors.push(line);return}
  const ws=ex.sets.map((s,i)=>s.type==='рабочий'?i:-1).filter(i=>i>=0);
  if(weights.length!==ws.length){errors.push(line);return}
  let bad=false;
  ws.forEach((si,j)=>{const w=weights[j]==='свой вес'?'свой вес':num(weights[j]);
   if(w===null){bad=true;return}
   const ch={day:d,ei:S.plan[d].indexOf(ex),si,oldW:ex.sets[si].planW,oldR:ex.sets[si].planR,
    newW:w,newR:reps&&reps[j]?reps[j]:ex.sets[si].planR,name:ex.name,setNo:si+1};
   if(ch.oldW!==ch.newW||String(ch.oldR)!==String(ch.newR))changes.push(ch)});
  if(bad)errors.push(line);
 });
 return{changes,errors};
}

     });
    });
   });
   const cw=wb.Sheets['Календарь'];

 const p=$('datePick');p.value=S.date;
 try{p.showPicker?p.showPicker():p.click()}catch(_){p.click()}};
$('datePick').onchange=e=>{if(e.target.value)go(e.target.value)};
$('btnCollapse').onclick=()=>{S.collapsed=!S.collapsed;save();renderHeader()};
$('btnSound').onclick=()=>{S.sound=!S.sound;save();renderHeader();toast(S.sound?'Звук включён':'Звук выключен');if(S.sound)beep('ok')};
$('weekStrip').onclick=e=>{const b=e.target.closest('[data-go]');if(b)go(b.dataset.go)};
$('dayChips').onclick=e=>{const b=e.target.closest('[data-day]');if(b)assign(+b.dataset.day)};
$('resetAuto').onclick=resetAuto;
$('btnPlan').onclick=toggleDay;
$('btnFinish').onclick=finish;
$('btnExport').onclick=exportXLSX;
$('btnExport').addEventListener('contextmenu',e=>{e.preventDefault();openExportInfo()});
let pressT=null;
$('btnExport').addEventListener('touchstart',()=>{pressT=setTimeout(()=>{pressT=null;openExportInfo()},520)},{passive:true});
$('btnExport').addEventListener('touchend',()=>{if(pressT){clearTimeout(pressT);pressT=null}},{passive:true});
$('btnImport').onclick=()=>$('fileInput').click();
$('fileInput').onchange=e=>{const f=e.target.files[0];if(f)importXLSX(f);e.target.value=''};
$('toastUndo').onclick=()=>{doUndo();$('toast').classList.remove('show')};
$('sheetX').onclick=closeSheet;scrim.onclick=closeSheet;
$('btnTimer').onclick=()=>{if(timer.id)stopT();else $('timerPop').classList.toggle('show')};
$('timerPop').onclick=e=>{const b=e.target.closest('[data-sec]');if(!b)return;const s=+b.dataset.sec;s?startT(s):stopT()};
$('bulkFill').onclick=()=>bulkAct('fill');
$('bulkClear').onclick=()=>bulkAct('clear');
$('bulkExit').onclick=()=>{selMode=false;sel.clear();renderAll()};
sheet.onclick=e=>{
 if(e.target.closest('[data-close]'))return closeSheet();
 if(e.target.closest('[data-export]')){closeSheet();return exportXLSX()}
 if(e.target.closest('[data-del]'))return deleteSession();
 const p=e.target.closest('[data-plan]');if(p){toggleEx(+p.dataset.plan);closeSheet()}
};
const scrollEl=$('scroll');
scrollEl.addEventListener('pointerdown',e=>{
 const g=e.target.closest('[data-grip]');
 if(g){startDrag(e,+g.dataset.grip)}
});
scrollEl.addEventListener('click',e=>{
 if(drag)return;
 const g=e.target.closest('[data-go]');if(g)return go(g.dataset.go);
 const rc=e.target.closest('[data-rest]');
 if(rc){const id=rc.dataset.rest;S.restChecks[S.date]=S.restChecks[S.date]||{};
  S.restChecks[S.date][id]=!S.restChecks[S.date][id];save();renderBody();return}
 const sb=e.target.closest('[data-sel]');
 if(sb){const i=+sb.dataset.sel;sel.has(i)?sel.delete(i):sel.add(i);
  sb.classList.toggle('on',sel.has(i));renderBulk();return}
 const h=e.target.closest('[data-hist]');
 if(h){if(selMode){const i=+h.dataset.hist;sel.has(i)?sel.delete(i):sel.add(i);renderBody();renderBulk();return}
  return exHistory(+h.dataset.hist)}
 const p=e.target.closest('[data-plan]');if(p)return toggleEx(+p.dataset.plan);
 if(e.target.closest('[data-planimport]'))return openPlanImport();
 if(e.target.closest('[data-views]'))return openViews();
 if(e.target.closest('[data-selmode]')){selMode=!selMode;sel.clear();renderAll();return}
 const t=e.target.closest('[data-tgl]');
 if(t){const v=t.dataset.tgl;if(v==='reset')S.filter={q:'',hideWarm:false,onlyEmpty:false};else S.filter[v]=!S.filter[v];renderBody()}
});
scrollEl.addEventListener('input',e=>{
 const i=e.target;
 if(i.id==='q'){S.filter.q=i.value;const pos=i.selectionStart;renderBody();
  const nq=$('q');if(nq){nq.focus();try{nq.setSelectionRange(pos,pos)}catch(_){}}return}
 if(i.classList.contains('inp')){setCell(+i.dataset.e,+i.dataset.s,i.dataset.f,i.value);liveUpdate(i)}
});
let tx=0,ty=0;
document.querySelector('.hdr').addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
document.querySelector('.hdr').addEventListener('touchend',e=>{
 const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
 if(Math.abs(dx)>52&&Math.abs(dx)>Math.abs(dy)*1.6)go(addD(S.date,dx<0?1:-1))},{passive:true});
document.addEventListener('keydown',e=>{
 if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
 if(e.key==='ArrowLeft')go(addD(S.date,-1));
 if(e.key==='ArrowRight')go(addD(S.date,1));
 if(e.key==='Escape')closeSheet();
 if(e.key.toLowerCase()==='e')openExportInfo();
});
document.addEventListener('pointerdown',()=>{if(S.sound&&!audioCtx){try{audioCtx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}},{once:true});
window.addEventListener('beforeunload',save);

/* ═══════════ СТАРТ ═══════════ */
load();seed();if(!S.date)S.date=today();save();renderAll();
$('btnTimer').textContent='⏱ '+fmtT(timer.preset);
</script>
</body>
</html>
