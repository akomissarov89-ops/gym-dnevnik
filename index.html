<title>Дневник</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;background:#0a0a0a;color:#e5e5e5;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0}
.header{padding:16px 16px 8px;display:flex;justify-content:space-between;align-items:flex-start}
.header h1{font-size:22px;font-weight:700}
.header .subtitle{font-size:13px;color:#888;margin-top:2px}
.header-buttons{display:flex;gap:8px}
.btn{padding:8px 14px;border-radius:10px;border:none;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
.btn-outline{background:transparent;border:1px solid #333;color:#e5e5e5}
.btn-outline:active{background:#222}
.btn-green{background:#b8e986;color:#0a0a0a}
.btn-green:active{background:#a0d470}
.calendar-bar{display:flex;align-items:center;gap:12px;padding:12px 16px}
.calendar-bar .nav-btn{width:36px;height:36px;border-radius:50%;background:#1a1a1a;border:none;color:#e5e5e5;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.calendar-bar .nav-btn:active{background:#333}
.calendar-bar .date-display{flex:1;text-align:center}
.calendar-bar .date-display .date{font-size:20px;font-weight:600}
.calendar-bar .date-display .weekday{font-size:13px;color:#888;margin-top:2px}
.day-tabs{display:flex;gap:8px;padding:0 16px 12px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.day-tabs::-webkit-scrollbar{display:none}
.day-tab{padding:8px 16px;border-radius:20px;background:#1a1a1a;border:none;color:#888;font-size:13px;font-weight:500;white-space:nowrap;cursor:pointer;transition:all .15s}
.day-tab.active{background:#e5e5e5;color:#0a0a0a}
.day-tab:active{opacity:.8}
.workout-area{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 100px}
.exercise-card{background:#141414;border-radius:16px;margin-bottom:12px;overflow:hidden}
.exercise-header{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222}
.exercise-header h3{font-size:16px;font-weight:600}
.exercise-header .meta{font-size:12px;color:#888}
.exercise-note{padding:0 16px 8px;font-size:12px;color:#666;font-style:italic}
.sets-header{display:grid;grid-template-columns:40px 1fr 80px 80px;padding:8px 16px;font-size:11px;color:#666;text-transform:uppercase;letter-spacing:.5px}
.sets-header>:nth-child(3),.sets-header>:nth-child(4){text-align:center}
.set-row{display:grid;grid-template-columns:40px 1fr 80px 80px;padding:10px 16px;align-items:center;border-top:1px solid #1a1a1a}
.set-num{font-size:14px;color:#666;font-weight:500}
.set-plan{font-size:13px;line-height:1.4}
.set-plan .plan-main{color:#e5e5e5}
.set-plan .plan-prev{color:#666;font-size:11px;margin-top:1px}
.set-plan .plan-type{color:#666;font-size:12px}
.set-input{display:flex;flex-direction:column;align-items:center;gap:2px}
.set-input label{font-size:9px;color:#666;text-transform:uppercase}
.set-input input{width:64px;height:32px;background:#1a1a1a;border:1px solid #333;border-radius:8px;color:#e5e5e5;text-align:center;font-size:14px;font-weight:600;outline:none}
.set-input input:focus{border-color:#b8e986}
.set-input input::placeholder{color:#444}
.copy-plan-btn{display:block;width:100%;padding:12px;background:transparent;border:none;color:#b8e986;font-size:14px;font-weight:600;text-align:right;cursor:pointer;border-top:1px solid #222}
.copy-plan-btn:active{background:#1a1a1a}
.bottom-bar{position:fixed;bottom:0;left:0;right:0;background:#0a0a0a;border-top:1px solid #222;padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px}
.bottom-bar .btn{flex:1;padding:14px;font-size:14px}
.hidden{display:none!important}
.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;z-index:1000;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
input[type=file]{display:none}
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>Дневник</h1>
    <div class="subtitle" id="planLabel">План не загружен</div>
  </div>
  <div class="header-buttons">
    <button class="btn btn-outline" onclick="document.getElementById('fileInput').click()">Загрузить Excel</button>
    <button class="btn btn-green" onclick="exportExcel()">Скачать Excel</button>
  </div>
</div>
<input type="file" id="fileInput" accept=".xlsx,.xls" onchange="importExcel(event)">

<div class="calendar-bar">
  <button class="nav-btn" onclick="navigateDay(-1)">‹</button>
  <div class="date-display">
    <div class="date" id="currentDate">—</div>
    <div class="weekday" id="currentWeekday">—</div>
  </div>
  <button class="nav-btn" onclick="navigateDay(1)">›</button>
</div>

<div class="day-tabs" id="dayTabs"></div>

<div class="workout-area" id="workoutArea"></div>

<div class="bottom-bar">
  <button class="btn btn-outline" onclick="copyPlanWeights()">⚡ Вес как в плане</button>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
// ===== ДАННЫЕ =====
const EXERCISES = {

    {name:'Икры машина',sets:[

  ],
  2: [
    {name:'Жим штанги лёжа',sets:[
      {type:'разминка',planW:20,planR:12},{type:'разминка',planW:60,planR:8},{type:'разминка',planW:75,planR:4},
      {type:'рабочий',planW:90,planR:'10–12'},{type:'рабочий',planW:92.5,planR:'8–10'},{type:'рабочий',planW:92.5,planR:'8–10'}
    ],note:''},
    {name:'Подтягивания',sets:[
      {type:'рабочий',planW:'свой вес',planR:'5–8'},{type:'рабочий',planW:'свой вес',planR:'5–8'},
      {type:'рабочий',planW:'свой вес',planR:'5–8'},{type:'рабочий',planW:'свой вес',planR:'5–8'}
    ],note:'Свой вес: когда во всех 4 подходах 8 повторений — добавлять вес'},
    {name:'Жим гантелей под 45°',sets:[
      {type:'разминка',planW:24,planR:10},
      {type:'рабочий',planW:28,planR:'8–12'},{type:'рабочий',planW:26,planR:'8–12'},{type:'рабочий',planW:26,planR:'8–12'}
    ],note:'18.11: 1-й рабочий взят 26 вместо 28; в 3–4 подходах меньше 8 — отдых 2–3 мин'},
    {name:'Тяга горизонт. кроссовер, узкая',sets:[
      {type:'разминка',planW:59,planR:10},
      {type:'рабочий',planW:79,planR:'10–12'},{type:'рабочий',planW:84,planR:'8–12'}
    ],note:''},
    {name:'Тяга машина, блины, одной рукой',sets:[
      {type:'рабочий',planW:65,planR:'10–12'},{type:'рабочий',planW:65,planR:'8–12'}
    ],note:'Каждая рука отдельно'},
    {name:'Махи стоя',sets:[
      {type:'рабочий',planW:10,planR:15},
      {type:'рабочий',planW:12,planR:'15–20'},{type:'рабочий',planW:12,planR:'15–20'}
    ],note:'Максимум 12 кг: прогрессия за счёт повторений (до 20), затем опускание 3 сек и пауза вверху'},
    {name:'Тяга канатов (задние дельты)',sets:[
      {type:'разминка',planW:54,planR:15},

    ],note:''},
    {name:'Трицепс кроссовер, прямая рукоять',sets:[

    ],note:''}
  ],
  3: [
    {name:'Жим армейский',sets:[
      {type:'разминка',planW:20,planR:12},
      {type:'рабочий',planW:37.5,planR:'8–12'},{type:'рабочий',planW:40,planR:'8–10'}
    ],note:''},
    {name:'Тяга блока сверху',sets:[
      {type:'разминка',planW:52,planR:12},
      {type:'рабочий',planW:77,planR:'8–12'},{type:'рабочий',planW:79,planR:'8–12'},{type:'рабочий',planW:77,planR:'8–12'}
    ],note:''},
    {name:'Брусья машина',sets:[
      {type:'разминка',planW:120,planR:12},
      {type:'рабочий',planW:138,planR:'10–12'},{type:'рабочий',planW:138,planR:'8–12'}
    ],note:''},
    {name:'Махи стоя',sets:[
      {type:'разминка',planW:10,planR:15},
      {type:'рабочий',planW:10,planR:'15–20'},{type:'рабочий',planW:10,planR:'15–20'},{type:'рабочий',planW:10,planR:'15–20'}
    ],note:'Максимум 12 кг: прогрессия за счёт повторений (до 20), затем опускание 3 сек и пауза вверху'},
    {name:'Махи сидя на задние дельты',sets:[
      {type:'разминка',planW:14,planR:15},
      {type:'рабочий',planW:18,planR:'12–15'},{type:'рабочий',planW:16,planR:'12–15'}
    ],note:''},
    {name:'Бицепс, гантели молотом',sets:[
      {type:'разминка',planW:14,planR:12},
      {type:'рабочий',planW:20,planR:'10–12'},{type:'рабочий',planW:18,planR:'10–12'}
    ],note:''},
    {name:'Бицепс в кроссовере, на пик',sets:[
      {type:'разминка',planW:18,planR:12},
      {type:'рабочий',planW:27,planR:'10–12'},{type:'рабочий',planW:27,planR:'10–12'}
    ],note:'Обе руки, каждая на свой блок; вес указан на сторону'},
    {name:'Бицепс, гантели на наклонной скамье',sets:[
      {type:'разминка',planW:10,planR:12},
      {type:'рабочий',planW:12,planR:'10–12'},{type:'рабочий',planW:12,planR:'10–12'},{type:'рабочий',planW:10,planR:'10–12'}
    ],note:'Новое упражнение: старт ≈ 60–70% веса гантелей молотом. Скамья 45–60°, плечи назад, нижняя точка с полной растяжкой'},
    {name:'Трицепс, тренажёр Скотта',sets:[
      {type:'разминка',planW:45,planR:12},
      {type:'рабочий',planW:59,planR:'10–12'},{type:'рабочий',planW:64,planR:'10–12'}
    ],note:''},
    {name:'Разгибание из-за головы, прямая рукоять',sets:[
      {type:'рабочий',planW:50,planR:'10–15'},{type:'рабочий',planW:54,planR:'10–15'}
    ],note:'Новое упражнение, прямая рукоять в кроссовере (без канатов): вес подобрать, ориентир 60–70% от жима вниз'}
  ]
};

const WEEKDAYS = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
const WEEKDAYS_SHORT = ['вс','пн','вт','ср','чт','пт','сб'];

// Состояние
let state = {
  currentDate: new Date(),
  currentDay: null, // 1, 2 или 3
  planDate: null,
  history: {}, // { 'YYYY-MM-DD': { day: 1, exercises: { ... } } }
  plan: JSON.parse(JSON.stringify(EXERCISES)) // текущий план
};

// ===== ИНИЦИАЛИЗАЦИЯ =====
function init() {
  loadState();
  if (!state.planDate) {
    state.planDate = formatDate(new Date());
  }
  findCurrentDay();
  render();
}

function loadState() {
  try {
    const saved = localStorage.getItem('gymState');
    if (saved) {
      const parsed = JSON.parse(saved);
      state = { ...state, ...parsed };
      if (state.currentDate) state.currentDate = new Date(state.currentDate);
    }
  } catch(e) {}
}

function saveState() {
  try {
    localStorage.setItem('gymState', JSON.stringify(state));
  } catch(e) {}
}

function formatDate(d) {
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const yyyy = d.getFullYear();
  return `${yyyy}-${mm}-${dd}`;
}

function formatDateDisplay(d) {
  return `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.${d.getFullYear()}`;
}

function formatDateShort(d) {
  return `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}`;
}

// Умный календарь: найти ближайший тренировочный день
function findCurrentDay() {
  const today = new Date(state.currentDate);
  const dayOfWeek = today.getDay(); // 0=вс, 1=пн, 2=вт, 3=ср, 4=чт, 5=пт, 6=сб
  
  // Пн(1)->День1, Ср(3)->День2, Пт(5)->День3
  const dayMap = {1:1, 3:2, 5:3};
  
  if (dayMap[dayOfWeek]) {
    state.currentDay = dayMap[dayOfWeek];
  } else {
    // Найти ближайший тренировочный день
    const offsets = [
      {days:1,day:1}, {days:2,day:2}, {days:4,day:3}, // от вс
      {days:2,day:2}, {days:1,day:3}, // от вт
      {days:1,day:3}, {days:2,day:1}, // от чт
      {days:3,day:1}, {days:2,day:2}  // от сб
    ];
    const offset = offsets[dayOfWeek];
    const targetDate = new Date(today);
    targetDate.setDate(today.getDate() + offset.days);
    state.currentDate = targetDate;
    state.currentDay = offset.day;
  }
}

// Навигация по дням
function navigateDay(direction) {
  const d = new Date(state.currentDate);
  d.setDate(d.getDate() + direction);
  state.currentDate = d;
  findCurrentDay();
  render();
}

function selectDay(dayNum) {
  state.currentDay = dayNum;
  render();
}

// ===== РЕНДЕР =====
function render() {
  renderHeader();
  renderCalendar();
  renderDayTabs();
  renderWorkout();
  saveState();
}

function renderHeader() {
  const planLabel = document.getElementById('planLabel');
  if (state.planDate) {
    const d = new Date(state.planDate);
    planLabel.textContent = `План от ${formatDateShort(d)} · Excel ${state.history[formatDate(state.currentDate)] ? 'заполнен' : 'не открыт'}`;
  } else {
    planLabel.textContent = 'План не загружен';
  }
}

function renderCalendar() {
  const d = state.currentDate;
  document.getElementById('currentDate').textContent = formatDateDisplay(d);
  document.getElementById('currentWeekday').textContent = WEEKDAYS[d.getDay()];
}

function renderDayTabs() {
  const container = document.getElementById('dayTabs');
  const d = state.currentDate;
  
  // Найти последние даты тренировок для каждого дня
  const lastDates = {};
  const sortedDates = Object.keys(state.history).sort().reverse();
  for (const dateStr of sortedDates) {
    const day = state.history[dateStr].day;
    if (!lastDates[day]) lastDates[day] = dateStr;
  }
  
  const tabs = [
    {num:1, label:`День 1${lastDates[1] ? ' посл. '+formatDateShort(new Date(lastDates[1])) : ''}`},
    {num:2, label:`День 2${lastDates[2] ? ' посл. '+formatDateShort(new Date(lastDates[2])) : ''}`},
    {num:3, label:`День 3${lastDates[3] ? ' посл. '+formatDateShort(new Date(lastDates[3])) : ''}`}
  ];
  
  container.innerHTML = tabs.map(t => 
    `<button class="day-tab ${t.num === state.currentDay ? 'active' : ''}" onclick="selectDay(${t.num})">${t.label}</button>`
  ).join('');
}

function renderWorkout() {
  const container = document.getElementById('workoutArea');
  const exercises = state.plan[state.currentDay];
  const dateKey = formatDate(state.currentDate);
  const saved = state.history[dateKey];
  const prevDate = findPreviousWorkoutDate(state.currentDay, dateKey);
  
  let html = `<div style="padding:12px 0 8px;font-size:14px;color:#888">
    <b style="color:#e5e5e5">${formatDateShort(state.currentDate)} · День ${state.currentDay}</b> — впишите вес и повторы в поля справа от каждого подхода
  </div>`;
  
  exercises.forEach((ex, exIdx) => {
    const totalSets = ex.sets.length;
    const workingSets = ex.sets.filter(s => s.type === 'рабочий').length;
    const exKey = `${state.currentDay}_${exIdx}`;
    const savedEx = saved?.exercises?.[exKey];
    
    html += `<div class="exercise-card">
      <div class="exercise-header">
        <h3>${ex.name}</h3>
        <div class="meta">${totalSets} подх. · ${workingSets} раб.</div>
      </div>`;
    
    if (ex.note) {
      html += `<div class="exercise-note">${ex.note}</div>`;
    }
    
    html += `<div class="sets-header"><div></div><div></div><div>вес, кг</div><div>повт.</div></div>`;
    
    ex.sets.forEach((set, setIdx) => {
      const setKey = `${exIdx}_${setIdx}`;
      const savedSet = savedEx?.[setKey];
      const prevSet = prevDate ? getPreviousSet(prevDate, state.currentDay, exIdx, setIdx) : null;
      
      const planW = set.planW;
      const planR = set.planR;
      const planWDisplay = typeof planW === 'number' ? planW : planW;
      const planRDisplay = typeof planR === 'number' ? planR : planR;
      
      const prevDisplay = prevSet ? `${formatDateShort(new Date(prevDate))}: ${prevSet.w} × ${prevSet.r}` : '';
      
      const actW = savedSet?.w ?? '';
      const actR = savedSet?.r ?? '';
      
      html += `<div class="set-row">
        <div class="set-num">${setIdx + 1}</div>
        <div class="set-plan">
          <div class="plan-main">план <b>${planWDisplay}</b> × <b>${planRDisplay}</b> <span class="plan-type">${set.type}</span></div>
          ${prevDisplay ? `<div class="plan-prev">${prevDisplay}</div>` : ''}
        </div>
        <div class="set-input">
          <label>кг</label>
          <input type="number" step="0.5" placeholder="—" value="${actW}" 
            onchange="saveSet('${dateKey}','${exKey}','${setKey}','w',this.value)"
            oninput="saveSet('${dateKey}','${exKey}','${setKey}','w',this.value)">
        </div>
        <div class="set-input">
          <label>повт</label>
          <input type="number" placeholder="—" value="${actR}"
            onchange="saveSet('${dateKey}','${exKey}','${setKey}','r',this.value)"
            oninput="saveSet('${dateKey}','${exKey}','${setKey}','r',this.value)">
        </div>
      </div>`;
    });
    
    html += `<button class="copy-plan-btn" onclick="copyPlanForExercise(${state.currentDay},${exIdx})">Вес как в плане</button>`;
    html += `</div>`;
  });
  
  container.innerHTML = html;
}

function findPreviousWorkoutDate(day, currentDate) {
  const dates = Object.keys(state.history).filter(d => state.history[d].day === day && d < currentDate).sort().reverse();
  return dates[0] || null;
}

function getPreviousSet(prevDate, day, exIdx, setIdx) {
  const exKey = `${day}_${exIdx}`;
  const setKey = `${exIdx}_${setIdx}`;
  return state.history[prevDate]?.exercises?.[exKey]?.[setKey] || null;
}

// ===== СОХРАНЕНИЕ ДАННЫХ =====
function saveSet(dateKey, exKey, setKey, field, value) {
  if (!state.history[dateKey]) {
    state.history[dateKey] = { day: state.currentDay, exercises: {} };
  }
  if (!state.history[dateKey].exercises[exKey]) {
    state.history[dateKey].exercises[exKey] = {};
  }
  if (!state.history[dateKey].exercises[exKey][setKey]) {
    state.history[dateKey].exercises[exKey][setKey] = {};
  }
  state.history[dateKey].exercises[exKey][setKey][field] = value ? (field === 'w' ? parseFloat(value) : parseInt(value)) : '';
  saveState();
  renderHeader();
}

function copyPlanForExercise(dayNum, exIdx) {
  const exercises = state.plan[dayNum];
  const ex = exercises[exIdx];
  const dateKey = formatDate(state.currentDate);
  const exKey = `${dayNum}_${exIdx}`;
  
  if (!state.history[dateKey]) {
    state.history[dateKey] = { day: dayNum, exercises: {} };
  }
  if (!state.history[dateKey].exercises[exKey]) {
    state.history[dateKey].exercises[exKey] = {};
  }
  
  ex.sets.forEach((set, setIdx) => {
    const setKey = `${exIdx}_${setIdx}`;
    state.history[dateKey].exercises[exKey][setKey] = {
      w: set.planW === 'свой вес' ? '' : set.planW,
      r: typeof set.planR === 'number' ? set.planR : parseInt(set.planR.split('–')[0])
    };
  });
  
  saveState();
  render();
  showToast('Веса из плана заполнены');
}

function copyPlanWeights() {
  const exercises = state.plan[state.currentDay];
  const dateKey = formatDate(state.currentDate);
  
  if (!state.history[dateKey]) {
    state.history[dateKey] = { day: state.currentDay, exercises: {} };
  }
  
  exercises.forEach((ex, exIdx) => {
    const exKey = `${state.currentDay}_${exIdx}`;
    if (!state.history[dateKey].exercises[exKey]) {

    }
    ex.sets.forEach((set, setIdx) => {

      state.history[dateKey].exercises[exKey][setKey] = {

        r: typeof set.planR === 'number' ? set.planR : parseInt(set.planR.split('–')[0])

  saveState();

}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// ===== ЭКСПОРТ EXCEL =====
function exportExcel() {
  const wb = XLSX.utils.book_new();
  
  // Листы День 1, 2, 3
  [1,2,3].forEach(dayNum => {
    const data = buildDaySheet(dayNum);
    const ws = XLSX.utils.aoa_to_sheet(data);
    XLSX.utils.book_append_sheet(wb, ws, `День ${dayNum}`);
  });
  
  // Журнал подходов
  const journalData = buildJournalSheet();
  const wsJournal = XLSX.utils.aoa_to_sheet(journalData);
  XLSX.utils.book_append_sheet(wb, wsJournal, 'Журнал подходов');
  
  // Прогресс
  const progressData = buildProgressSheet();
  const wsProgress = XLSX.utils.aoa_to_sheet(progressData);
  XLSX.utils.book_append_sheet(wb, wsProgress, 'Прогресс');
  
  // Недели
  const weeksData = buildWeeksSheet();
  const wsWeeks = XLSX.utils.aoa_to_sheet(weeksData);
  XLSX.utils.book_append_sheet(wb, wsWeeks, 'Недели');
  
  // Сводка
  const summaryData = buildSummarySheet();
  const wsSummary = XLSX.utils.aoa_to_sheet(summaryData);
  XLSX.utils.book_append_sheet(wb, wsSummary, 'Сводка');
  
  const dateStr = formatDate(state.currentDate).replace(/-/g,'.');
  XLSX.writeFile(wb, `plan_trenirovok_${dateStr}.xlsx`);
  showToast('Excel скачан');
}

function buildDaySheet(dayNum) {
  const exercises = state.plan[dayNum];
  const headers = ['Упражнение','Подход','Тип','Вес, план','Повторения, план'];
  
  // Добавить колонки для каждой даты в истории этого дня
  const dates = Object.keys(state.history).filter(d => state.history[d].day === dayNum).sort();
  dates.forEach(d => {
    headers.push(`${formatDateShort(new Date(d))} вес`);
    headers.push(`${formatDateShort(new Date(d))} повт.`);
  });
  headers.push('','Заметки');
  
  const data = [headers];
  
  exercises.forEach((ex, exIdx) => {
    const exKey = `${dayNum}_${exIdx}`;
    ex.sets.forEach((set, setIdx) => {
      const row = [ex.name, setIdx+1, set.type, set.planW, set.planR];
      dates.forEach(d => {
        const saved = state.history[d]?.exercises?.[exKey]?.[`${exIdx}_${setIdx}`];
        row.push(saved?.w ?? '', saved?.r ?? '');
      });
      row.push('', exIdx === 0 ? ex.note : '');
      data.push(row);
    });
  });
  
  return data;
}

function buildJournalSheet() {
  const headers = ['Дата','День','Упражнение','Подход','Тип','Вес, кг','Повторения','Объём, кг','План: вес','План: повторения'];
  const data = [headers];
  
  const dates = Object.keys(state.history).sort();
  dates.forEach(dateKey => {
    const record = state.history[dateKey];
    const dayNum = record.day;
    const exercises = state.plan[dayNum];
    
    exercises.forEach((ex, exIdx) => {
      const exKey = `${dayNum}_${exIdx}`;
      ex.sets.forEach((set, setIdx) => {
        const setKey = `${exIdx}_${setIdx}`;
        const saved = record.exercises?.[exKey]?.[setKey];
        const w = saved?.w ?? '';
        const r = saved?.r ?? '';
        const volume = (w && r && set.type === 'рабочий') ? w * r : 0;
        
        data.push([
          formatDateDisplay(new Date(dateKey)),
          `День ${dayNum}`,
          ex.name,
          setIdx+1,
          set.type,
          w, r, volume,
          set.planW, set.planR
        ]);
      });
    });
  });
  
  return data;
}

function buildProgressSheet() {
  const headers = ['Упражнение','Рабочих подходов','Макс. вес, кг','Объём, кг','Первое занятие','Вес первого, кг','Последнее занятие','Вес последнего, кг','Изменение, кг'];
  const data = [headers];
  
  const allExercises = new Set();
  [1,2,3].forEach(d => state.plan[d].forEach((ex,i) => allExercises.add(`${d}_${i}`)));
  
  allExercises.forEach(exKey => {
    const [dayNum, exIdx] = exKey.split('_').map(Number);
    const ex = state.plan[dayNum][exIdx];
    const dates = Object.keys(state.history).filter(d => state.history[d].day === dayNum).sort();
    
    if (dates.length === 0) return;
    
    let maxWeight = 0, totalVolume = 0, workingSets = 0;
    let firstDate = null, firstWeight = 0, lastDate = null, lastWeight = 0;
    
    dates.forEach(dateKey => {
      const record = state.history[dateKey];
      ex.sets.forEach((set, setIdx) => {
        if (set.type !== 'рабочий') return;
        const saved = record.exercises?.[exKey]?.[`${exIdx}_${setIdx}`];
        if (!saved?.w) return;
        workingSets++;
        totalVolume += saved.w * (saved.r || 0);
        if (saved.w > maxWeight) maxWeight = saved.w;
        if (!firstDate) { firstDate = dateKey; firstWeight = saved.w; }
        lastDate = dateKey;
        lastWeight = saved.w;
      });
    });
    
    data.push([
      ex.name, workingSets, maxWeight, totalVolume,
      firstDate ? formatDateDisplay(new Date(firstDate)) : '',
      firstWeight,
      lastDate ? formatDateDisplay(new Date(lastDate)) : '',
      lastWeight,
      lastWeight - firstWeight
    ]);
  });
  
  return data;
}

function buildWeeksSheet() {
  const headers = ['Неделя с (пн)','Вес ср., кг','Δ к пред. неделе','Дней с весом','Ккал ср.','Белок ср., г','Дней с едой','Вывод'];
  const data = [headers];
  // Заглушка — данные о весе и питании будут добавлены при загрузке Excel от пользователя
  return data;
}

  const data = [

    ['День','Фокус','Всего подходов','Рабочих подходов','Время, оценка','День недели'],

    [''],

// ===== ИМПОРТ EXCEL =====
function importExcel(event) {
  const file = event.target.files[0];
  if (!file) return;
  
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type:'array'});
      
      // Парсим листы День 1, 2, 3
      [1,2,3].forEach(dayNum => {
        const sheetName = `День ${dayNum}`;
        if (!wb.Sheets[sheetName]) return;
        const ws = wb.Sheets[sheetName];
        const json = XLSX.utils.sheet_to_json(ws, {header:1});
        
        if (json.length < 2) return;
        
        const headers = json[0];
        // Найти колонки с датами (формат "DD.MM вес" / "DD.MM повт.")
        const dateCols = {};
        headers.forEach((h, idx) => {
          if (typeof h === 'string' && h.match(/^\d{2}\.\d{2}/)) {
            const dateStr = h.split(' ')[0];
            const field = h.includes('повт') ? 'r' : 'w';
            if (!dateCols[dateStr]) dateCols[dateStr] = {};
            dateCols[dateStr][field] = idx;
          }
        });
        
        // Парсим упражнения
        let currentExIdx = -1;
        json.slice(1).forEach(row => {
          if (!row[0]) return;
          const exName = row[0];
          const setNum = row[1];
          const setType = row[2];
          const planW = row[3];
          const planR = row[4];
          
          // Найти упражнение в плане
          const exIdx = state.plan[dayNum].findIndex(e => e.name === exName);
          if (exIdx === -1) return;
          currentExIdx = exIdx;
          const setIdx = (typeof setNum === 'number' ? setNum : parseInt(setNum)) - 1;
          if (setIdx < 0 || setIdx >= state.plan[dayNum][exIdx].sets.length) return;
          
          // Обновить план если есть новые веса (колонки после дат)
          // Формат: после колонок с датами идут пустые колонки, потом Заметки
          // Ищем колонку "След. вес" — но в упрощённом формате берём последние числовые значения
          
          // Сохранить историю по датам
          Object.keys(dateCols).forEach(dateStr => {
            const wIdx = dateCols[dateStr].w;
            const rIdx = dateCols[dateStr].r;
            const w = row[wIdx];
            const r = row[rIdx];
            if (w !== undefined && w !== '') {
              const fullDate = `${dateStr}.${new Date().getFullYear()}`;
              const dateKey = formatDate(parseDateShort(dateStr));
              const exKey = `${dayNum}_${exIdx}`;
              const setKey = `${exIdx}_${setIdx}`;
              if (!state.history[dateKey]) state.history[dateKey] = {day: dayNum, exercises: {}};
              if (!state.history[dateKey].exercises[exKey]) state.history[dateKey].exercises[exKey] = {};
              state.history[dateKey].exercises[exKey][setKey] = {
                w: typeof w === 'number' ? w : parseFloat(w),
                r: typeof r === 'number' ? r : parseInt(r)
              };
            }
          });
          
          // Обновить план (берём значения из колонок после дат — это "След. вес/повт")
          // В упрощённом формате: если есть значения после последних дат
          const lastDateCol = Math.max(...Object.values(dateCols).map(c => Math.max(c.w, c.r)));
          const nextWIdx = lastDateCol + 2; // пропуск пустой колонки
          const nextRIdx = nextWIdx + 1;
          if (row[nextWIdx] !== undefined && row[nextWIdx] !== '') {
            state.plan[dayNum][exIdx].sets[setIdx].planW = row[nextWIdx];
          }
          if (row[nextRIdx] !== undefined && row[nextRIdx] !== '') {
            state.plan[dayNum][exIdx].sets[setIdx].planR = row[nextRIdx];
          }
        });
      });
      
      state.planDate = formatDate(new Date());
      saveState();
      render();
      showToast('Excel загружен, план обновлён');
    } catch(err) {
      console.error(err);
      showToast('Ошибка загрузки: ' + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
  event.target.value = '';
}

function parseDateShort(str) {
  const [dd, mm] = str.split('.').map(Number);
  const d = new Date();
  d.setDate(dd);
  d.setMonth(mm - 1);
  return d;
}
